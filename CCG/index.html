<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wrestling Card Game (hot-seat)</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Barlow+Semi+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#070b14;--panel:#151c2b;--bg2:#10162a;--line:#2b3550;--ink:#e9e4da;--mute:#8f98b3;--acc:#ff7a3d;--gold:#f0c23c;--w:#d9632b;--p:#2f8fbf;--e:#e0b23a}
*{box-sizing:border-box}
body{margin:0;padding:14px;font:500 15px/1.45 'Barlow Semi Condensed','Segoe UI',system-ui,sans-serif;color:var(--ink);background:radial-gradient(1.5px 1.5px at 12% 18%,#fff9 50%,#0000),radial-gradient(1px 1px at 38% 62%,#fff7 50%,#0000),radial-gradient(1.5px 1.5px at 71% 24%,#fff9 50%,#0000),radial-gradient(1px 1px at 88% 78%,#fff7 50%,#0000),radial-gradient(ellipse at 50% 120%,#5a1d12 0%,#0000 55%),linear-gradient(#070b14,#0e1424) fixed;min-height:100vh}
#app{max-width:1200px;margin:auto}
h1,h2,h3,.bar,.pn{font-family:'Big Shoulders Display',Impact,'Arial Narrow',sans-serif;font-weight:700;letter-spacing:1px}
h1{font-size:30px;letter-spacing:7px;text-align:center;margin:4px 0 10px}h1 span{color:var(--acc)}
h3{font-size:17px;margin:20px 0 6px;color:var(--acc);text-transform:uppercase}
.hint{color:var(--mute);margin:0 0 8px}.hint.big{font-size:20px;margin:22px 0}
.hud{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pp{background:linear-gradient(#18203366,#101626);border:2px solid var(--line);border-radius:12px;padding:8px 10px}
.pp.on{border-color:var(--acc);box-shadow:0 0 16px #ff7a3d55}
.pn{font-size:16px;display:flex;justify-content:space-between;align-items:baseline}
.pn small{font:500 13px 'Barlow Semi Condensed',sans-serif;color:var(--mute);letter-spacing:0}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:6px}
.tile{background:#0a0e17;border:1px solid var(--line);border-radius:8px;text-align:center;padding:4px 2px}
.tile small{display:block;font-size:10px;color:var(--mute);letter-spacing:1.5px}
.tile b{font:700 22px 'Barlow Semi Condensed',sans-serif;display:block;line-height:1.1}.tile i{font-style:normal;font-size:11px;color:#8fd98f}
.pills span{background:#0a0e17;border:1px solid var(--line);border-radius:12px;padding:2px 12px;font-size:16px}
button{font:inherit;font-weight:700;background:var(--acc);color:#1a0d05;border:0;padding:7px 16px;border-radius:20px;cursor:pointer;margin:2px 6px 2px 0;text-transform:uppercase;letter-spacing:.5px;font-size:13px}
button:hover:not(:disabled){filter:brightness(1.12)}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
button:disabled{background:#2a3047;color:#6c7490;cursor:not-allowed}
button.ghost{background:transparent;color:var(--ink);border:2px solid var(--line)}
.bar{display:flex;justify-content:space-between;align-items:center;margin:16px 0 8px;font-size:22px;text-transform:uppercase}
.bar span{font:700 13px 'Barlow Semi Condensed',sans-serif;color:#1a0d05;background:var(--acc);padding:3px 14px;border-radius:14px;letter-spacing:.5px}
.row{display:flex;flex-wrap:wrap;gap:14px}
.cw{width:190px}
.c{position:relative;width:190px;height:285px;border:3px solid var(--k,var(--line));border-radius:12px;overflow:hidden;background:#0a0e17;box-shadow:0 4px 14px #000a;transition:transform .15s,box-shadow .15s}
.c:hover{transform:translateY(-4px);box-shadow:0 10px 22px #000c}
.c.sel{box-shadow:0 0 0 3px var(--acc),0 10px 22px #000c;transform:translateY(-6px)}
.c.off{opacity:.4;filter:grayscale(.6)}.c.champ{box-shadow:0 0 0 2px var(--gold),0 0 18px #f0c23caa}
.im{position:absolute;inset:0;background:radial-gradient(circle at 50% 35%,color-mix(in srgb,var(--k) 55%,#000),#0a0e17 75%);display:grid;place-items:center}
.im span{font:110px 'Big Shoulders Display',Impact,sans-serif;color:#fff2}
.im img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.top{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;gap:6px;padding:5px 7px;min-height:32px;background:linear-gradient(var(--k),color-mix(in srgb,var(--k) 65%,#000));font:700 15px 'Barlow Semi Condensed','Segoe UI',sans-serif;color:#fff;text-shadow:0 1px 2px #0008}
.top b{flex:1;line-height:1.1}
.coin{flex:none;width:26px;height:26px;border-radius:50%;background:radial-gradient(#ffd96b,#c8921a);color:#3a2500;display:grid;place-items:center;font:700 14px 'Barlow Semi Condensed',sans-serif;font-style:normal;border:2px solid #fff6}
.tg{display:flex;gap:3px;flex-wrap:wrap;justify-content:flex-end;max-width:68px}.tg em{font:600 9px 'Barlow Semi Condensed',sans-serif;font-style:normal;background:#0007;border-radius:6px;padding:0 5px;text-transform:uppercase}
.stat{position:absolute;top:50px;display:flex;align-items:center;gap:3px;padding:2px 9px 2px 7px;font-size:13px;color:#fff;background:#b8332e;border:2px solid #fff5;border-left:0;border-radius:0 14px 14px 0;left:0}
.stat b{font:700 22px 'Barlow Semi Condensed',sans-serif}
.stat.d{left:auto;right:0;padding:2px 7px 2px 9px;background:#2d6cc0;border:2px solid #fff5;border-right:0;border-radius:14px 0 0 14px}
.flag{position:absolute;right:6px;padding:1px 9px;border-radius:10px;font-weight:700;font-size:12px}
.flag.cr{top:88px;background:var(--gold);color:#2a1d00}.flag.hy{top:112px;background:#ff9a3d;color:#2a1200}
.tx{position:absolute;left:0;right:0;bottom:0;padding:16px 36px 7px 8px;background:linear-gradient(#0000,#0b0f1acc 22%,#0b0f1af2);font:500 12px/1.3 'Barlow Semi Condensed','Segoe UI',sans-serif}
.tx small{display:block;text-transform:uppercase;letter-spacing:1px;color:var(--p);filter:brightness(1.5);font-size:10px}
.tx p{margin:3px 0 0;background:#ffffff14;border-radius:6px;padding:3px 6px}
.pay{display:flex;gap:8px;flex-wrap:wrap;font-weight:700;color:#ffe3a6;font-size:12px}
.vps{position:absolute;right:6px;bottom:6px;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font:700 16px 'Barlow Semi Condensed',sans-serif;font-style:normal;color:#3a2500;background:radial-gradient(#ffd96b,#d89b22);border:2px solid #fff6}
.bt{margin-top:6px}.bt button{width:100%;margin:0}
.c.back{display:grid;place-items:center;align-content:center;background:repeating-linear-gradient(45deg,#1c2440 0 10px,#151b33 10px 20px);border-color:var(--line)}
.c.back b{font:56px 'Big Shoulders Display',Impact,sans-serif;color:#fff3}.c.back small{color:var(--mute)}
.slots{display:flex;gap:14px;overflow-x:auto;padding:2px 2px 12px;scroll-snap-type:x proximity}
.slot{flex:none;scroll-snap-align:start;background:var(--bg2);border:2px solid var(--line);border-radius:12px;padding:8px 12px 12px}
.slot.main{border-color:var(--gold);box-shadow:0 0 18px #f0c23c33}
.sh{display:flex;align-items:center;gap:10px;margin-bottom:6px;font:700 16px 'Big Shoulders Display',Impact,sans-serif;letter-spacing:1px}
.sh em{color:var(--gold);font-style:normal}.sh button{margin-left:auto}
.cols{display:grid;grid-template-columns:repeat(2,190px);gap:16px;zoom:.8}
.role{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--mute);margin-bottom:4px}
.empty{width:190px;height:285px;border:2px dashed var(--line);border-radius:12px;display:grid;place-items:center;color:var(--mute)}
.atts{margin-top:5px;display:flex;flex-wrap:wrap;gap:4px}.att{background:var(--p);color:#04121c;border-radius:10px;padding:0 9px;font-size:12px;font-weight:700}
.acts{display:flex;flex-wrap:wrap;align-items:center}
#log{white-space:pre-wrap;background:#05070f;border:1px solid var(--line);border-radius:10px;padding:12px;max-height:420px;overflow:auto;font:12px/1.55 ui-monospace,Consolas,monospace;margin:8px 0}
.pass{text-align:center;margin:12vh auto;max-width:420px;background:var(--panel);border:2px solid var(--acc);border-radius:16px;padding:30px}
.pass h2{font-size:28px;color:var(--acc);margin:0 0 12px;text-transform:uppercase}
.pv{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 10px}
.pt{flex:none;background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:4px 6px}
.pt.main{border-color:var(--gold)}.pt small{display:block;color:var(--mute);font-size:10px;letter-spacing:1px;margin-bottom:2px}
.pt>div{display:flex;gap:4px}
.mc{position:relative;width:62px;height:84px;border:2px solid var(--k,var(--line));border-radius:6px;overflow:hidden;background:#0a0e17;font-size:9px;line-height:1.1}
.mc.me{--k:var(--acc)}.mc.op{--k:var(--p)}
.mc .im span{font-size:30px}
.mc b{position:absolute;left:0;right:0;top:0;background:#000a;padding:1px 2px;font-weight:700;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;z-index:1}
.mc u{position:absolute;left:0;right:0;bottom:0;background:#000b;text-decoration:none;text-align:center;padding:1px 0;color:#ffe3a6;font-weight:700;z-index:1}
.mc i{position:absolute;right:2px;top:12px;background:var(--p);color:#04121c;border-radius:6px;padding:0 4px;font-style:normal;font-weight:700;z-index:1}
.mc.none{display:grid;place-items:center;text-align:center;border-style:dashed;color:var(--mute);background:none}
.mc.back{display:grid;place-items:center;background:repeating-linear-gradient(45deg,#1c2440 0 6px,#151b33 6px 12px);border-color:var(--line);font:700 22px 'Big Shoulders Display',sans-serif;color:#fff4}
.sel-row{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap}
.arena{display:flex;flex-wrap:wrap;gap:26px;justify-content:center;align-items:flex-start;margin:10px 0}
.side{width:230px;text-align:center;transition:opacity .5s,filter .5s,transform .5s}
.side.win{transform:scale(1.04);filter:drop-shadow(0 0 16px var(--gold))}
.side.lose{opacity:.45;filter:grayscale(.7)}
.vs{align-self:center;font:700 34px 'Big Shoulders Display',Impact,sans-serif;color:var(--acc)}
.flip{width:190px;height:285px;margin:0 auto;perspective:900px}
.flip .in{position:relative;width:100%;height:100%;transition:transform .9s cubic-bezier(.2,.8,.2,1);transform-style:preserve-3d}
.flip.on .in{transform:rotateY(180deg)}
.flip .f,.flip .b{position:absolute;inset:0;backface-visibility:hidden}
.flip .f{transform:rotateY(180deg)}
.rv{opacity:0;transform:translateY(8px);transition:opacity .4s,transform .4s}.rv.on{opacity:1;transform:none}
.calc{margin-top:10px;text-align:left}
.cl{display:flex;justify-content:space-between;gap:8px;background:#ffffff10;border-radius:6px;padding:3px 8px;margin:3px 0;font-size:13px}.cl b{color:var(--gold)}
.tot{font:700 46px 'Big Shoulders Display',Impact,sans-serif;line-height:1;margin-top:6px}.tot.pop{animation:pop .4s}
@keyframes pop{0%{transform:scale(1.5);color:var(--gold)}100%{transform:scale(1)}}
.tl{font-size:11px;letter-spacing:2px;color:var(--mute)}
.verdict{text-align:center;font:700 20px 'Big Shoulders Display',Impact,sans-serif;margin:14px 0 6px;letter-spacing:1px}
.verdict b{display:block;font-size:30px;color:var(--gold);margin-top:2px}
.rewards{display:flex;flex-direction:column;align-items:center;gap:6px}
.rw{background:linear-gradient(90deg,#f0c23c33,#f0c23c11);border:1px solid #f0c23c66;border-radius:20px;padding:4px 18px;font-weight:700}

/* ---- v2 visual upgrade ---- */
h1{background:linear-gradient(90deg,#fff,#ffd9a8 40%,var(--acc));-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none;font-size:34px}
h1 span{color:transparent}
.tb{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center;margin:0 0 12px}
.tb select{font:600 13px 'Barlow Semi Condensed',sans-serif;background:#0a0e17;color:var(--ink);border:2px solid var(--line);border-radius:20px;padding:5px 10px}
button:not(.ghost):not(:disabled){background:linear-gradient(#ff9055,#e0561b);box-shadow:0 2px 0 #7a2a0a}
button:not(.ghost):not(:disabled):active{transform:translateY(1px);box-shadow:none}
.pp{backdrop-filter:blur(4px)}.pp.on{animation:glow 2s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 0 26px #ff7a3d88}}
.c{box-shadow:0 4px 14px #000a,inset 0 0 0 1px #fff2}
.c::after{content:'';position:absolute;inset:0;background:linear-gradient(115deg,#0000 30%,#fff3 46%,#0000 62%);transform:translateX(-130%);transition:transform .7s;pointer-events:none;z-index:3}
.c:hover::after{transform:translateX(130%)}
.coin{box-shadow:0 0 8px #f0c23c88}.stat{font-size:14px;box-shadow:0 2px 6px #0008}.stat b{font-size:24px}
.tx p{border-left:3px solid var(--k);background:#ffffff18}
.tx{max-height:60%;overflow:hidden}
@media (prefers-reduced-motion:reduce){.pp.on,.c::after{animation:none;transition:none}}
/* ---- card editor ---- */
#ed{color:var(--ink);display:none;position:fixed;inset:0;z-index:50;background:#070b14f5;overflow:auto;padding:14px}
.edh{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}.edh h2{margin:0 12px 0 0;font-size:24px;color:var(--acc)}
.tabs{display:flex;gap:4px}
.edb{display:grid;grid-template-columns:230px 1fr 230px;gap:16px;align-items:start}
.edl{display:flex;flex-direction:column;gap:4px;max-height:80vh;overflow:auto}
.eli{background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:6px 10px;cursor:pointer;display:flex;justify-content:space-between;gap:6px}
.eli.on{border-color:var(--acc);background:#2a1a14}.eli em{font:700 10px 'Barlow Semi Condensed',sans-serif;font-style:normal;background:var(--gold);color:#2a1d00;border-radius:8px;padding:1px 7px;white-space:nowrap}
.edf{display:flex;flex-direction:column;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.edf label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--mute);letter-spacing:.5px}
.edf input[type=text],.edf input[type=number],.edf textarea,.edf select,.edf input:not([type]){font:600 15px 'Barlow Semi Condensed',sans-serif;background:#0a0e17;color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:6px 8px;min-width:0}
.edf .chk{flex-direction:row;align-items:center;gap:8px;color:var(--ink);font-size:14px}
.fxs{display:flex;flex-direction:column;gap:6px;align-items:flex-start}.fxr{display:flex;gap:6px;flex-wrap:wrap}.fxr input[type=number]{width:70px}
.img .acts{gap:8px}.img input[type=text]{flex:1;min-width:200px}
.edp{position:sticky;top:0}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--gold);color:#2a1d00;font-weight:700;padding:8px 20px;border-radius:20px;z-index:99;opacity:0;pointer-events:none;transition:opacity .25s}
#toast.on{opacity:1}
@media(max-width:860px){.edb{grid-template-columns:1fr}.edl{max-height:200px}.edp{position:static}}

/* eFed cards: art on top, stats strip underneath (never covering the art) */
.c.ef{display:flex;flex-direction:column}
.c.ef .top{position:relative;flex:none}
.c.ef .im{position:relative;inset:auto;flex:1;min-height:0}
.c.ef .tx{position:relative;flex:none;padding:7px 8px;background:#0b0f1a;border-top:2px solid var(--k)}
.c.ef .pay{justify-content:space-around;font-size:14px}

/* ---- v4: black-leather and brass look ---- */
:root{--bg:#08090b;--panel:#121317;--bg2:#0d0e11;--line:#292c33;--ink:#ebe7de;--mute:#8b909a;--acc:#c8a24b;--gold:#dcb75e;--w:#a8372d;--p:#6b82a0;--e:#b8923a}
body{background:radial-gradient(ellipse 80% 50% at 50% -8%,#33291500 0,#2d2413aa 0,#0000 70%),repeating-linear-gradient(135deg,#ffffff06 0 1px,#0000 1px 4px),#08090b fixed}
h1{font-weight:900;font-size:46px;letter-spacing:14px;background:linear-gradient(#f6e6b4,#c8a24b 55%,#8a6a22);-webkit-background-clip:text;background-clip:text;color:transparent;margin:6px 0 12px}
h1 span{color:transparent}
h3{color:var(--acc);letter-spacing:3px;font-size:18px;border-bottom:1px solid var(--line);padding-bottom:4px}
.bar{font-size:27px;letter-spacing:2px;border-left:4px solid var(--acc);padding-left:12px}
.bar span{background:linear-gradient(#e6c982,#b58a32);color:#17120a;border-radius:3px;letter-spacing:1.5px;text-transform:uppercase}
button{border-radius:4px;letter-spacing:1.5px;font-size:13px}
button:not(.ghost):not(:disabled){background:linear-gradient(#e6c982,#b58a32);color:#17120a;box-shadow:0 2px 0 #5c4416,0 6px 14px #0008}
button.ghost{border:1px solid #4a4f5a;color:var(--ink)}button.ghost:hover:not(:disabled){border-color:var(--acc);color:var(--acc)}
.tb select{border:1px solid #4a4f5a;border-radius:4px;background:#0d0e11}
.pp{border-radius:8px;border:1px solid var(--line);border-top:2px solid #4a4f5a;background:linear-gradient(#17181d,#0e0f12)}
.pp.on{border-color:var(--acc);border-top-color:var(--gold);animation:none;box-shadow:0 0 0 1px #c8a24b44,0 8px 30px #c8a24b22}
.pn{letter-spacing:2px;font-size:18px}
.tile{border-radius:4px;background:#08090b}.tile b{font-size:28px;font-weight:800;letter-spacing:.5px}.tile i{color:#9ec59a}
.slot,.pt{border-radius:8px}.slot.main,.pt.main{border-color:var(--acc)}
.c{border-radius:8px;border:1px solid color-mix(in srgb,var(--k) 75%,#fff 10%);box-shadow:0 0 0 1px #000,0 10px 24px #000c,inset 0 0 0 1px #ffffff1a}
.c:hover{box-shadow:0 0 0 1px #000,0 16px 30px #000d,inset 0 0 0 1px #ffffff2a}
.c.sel{box-shadow:0 0 0 2px var(--acc),0 14px 30px #000d}
.im{background:radial-gradient(circle at 50% 30%,color-mix(in srgb,var(--k) 40%,#000),#050506 78%)}.im span{color:#ffffff14}
.top{background:linear-gradient(#000000d0,#000000f0);border-bottom:2px solid var(--k);font-size:17px;text-transform:uppercase;letter-spacing:.6px;font-weight:700;text-shadow:none}
.top b{font-family:'Big Shoulders Display',Impact,sans-serif;font-weight:800;font-size:19px;letter-spacing:.8px}
.tg em{background:color-mix(in srgb,var(--k) 55%,#000);border:1px solid #ffffff30;border-radius:3px;letter-spacing:.8px}
.coin{background:linear-gradient(145deg,#f3dc92,#a8812d);border:1px solid #3a2a08;color:#2a1d04;box-shadow:0 1px 4px #000a}
.stat{background:linear-gradient(#22242a,#0a0b0e);border:1px solid #ffffff26;border-left:0;border-bottom:3px solid #c0392b;border-radius:0 4px 4px 0;font-weight:700}
.stat.d{border:1px solid #ffffff26;border-right:0;border-bottom:3px solid #4a86d6;border-radius:4px 0 0 4px}
.stat b{font-family:'Big Shoulders Display',Impact,sans-serif;font-size:27px;font-weight:800}
.tx{background:linear-gradient(#0000,#050608d8 30%,#050608f8)}
.tx p{border:0;border-radius:0;background:none;padding:0;font-size:12.5px}
.pay{color:#efd9a0;letter-spacing:.3px}
.vps{background:linear-gradient(145deg,#f3dc92,#a8812d);border:1px solid #3a2a08;border-radius:5px;color:#2a1d04}
.c.ef .tx{background:#08090b;border-top:1px solid var(--k)}
.c.back{background:repeating-linear-gradient(45deg,#17191e 0 5px,#0e0f13 5px 10px);border-color:#3a3e48}.c.back b{color:#c8a24b44}
.verdict{letter-spacing:3px}.verdict b{color:var(--gold);font-size:38px;font-weight:900;letter-spacing:4px}
.rw{background:linear-gradient(90deg,#c8a24b30,#c8a24b0a);border:1px solid #c8a24b66;border-radius:3px}
.vs{color:var(--acc);font-weight:900;font-size:40px}
.side.win{filter:drop-shadow(0 0 18px #c8a24bcc)}
.pass{border:1px solid var(--acc);border-radius:8px;background:linear-gradient(#17181d,#0c0d10)}
.att{background:#2b3038;color:var(--ink);border:1px solid #4a4f5a;border-radius:3px}
::-webkit-scrollbar{height:8px;width:8px}::-webkit-scrollbar-thumb{background:#3a3e48;border-radius:4px}::-webkit-scrollbar-track{background:#0d0e11}
.rule{border:1px solid var(--line);border-radius:8px;padding:10px;background:#0d0e11;display:flex;flex-direction:column;gap:8px;width:100%}
.rh,.rb{display:flex;flex-wrap:wrap;gap:6px;align-items:center}.rb{flex-direction:column;align-items:flex-start}.rule b{color:var(--acc);letter-spacing:2px;min-width:44px}
.rule .fxr{align-items:center}.rule .hint{margin:0}
/* cards with real art: show only the picture (the art prints its own name and stats) */
body.artonly .c:has(.im img) .top,body.artonly .c:has(.im img) .stat,body.artonly .c:has(.im img) .tx,body.artonly .c:has(.im img) .im span,body.artonly .c:has(.im img) .vps,body.artonly .c:has(.im img) .flag{display:none}

</style></head><body><div id="app"></div><div id="ed"></div><input type="file" id="imp" accept=".js,.json" hidden onchange="edImport(this)"><div id="toast"></div><script src="cards.js"></script>
<script>
// ---------- CARD DATA (placeholder test set; later loaded from Supabase) ----------
const W=(n,atk,def,vp,cost,win,promo,tags,fx=[],img='')=>({n,atk,def,vp,cost,win,promo,tags,fx,img,hype:0,champ:false});
const P=(n,cat,fx)=>({n,cat,fx});
const DEF_W=[
W('Iron Mako',6,3,2,4,3,2,['Brawler'],[{k:'atk',n:1,tag:'Brawler'}]),
W('Vex Valentine',4,5,1,3,2,3,['Technical'],[{k:'def',n:2,tag:'Technical'}]),
W('Big Tombstone',7,2,2,5,4,1,['Giant']),
W('Luna Blaze',5,4,1,3,3,3,['High Flyer'],[{k:'atk',n:2,tag:'High Flyer'}]),
W('Rex Hammer',5,5,3,6,4,2,['Brawler','Veteran']),
W('Kid Nitro',3,3,0,1,2,2,['High Flyer']),
W('Mad Dog Morgan',6,2,1,3,3,2,['Brawler'],[{k:'win',n:2}]),
W('Silk Sebastian',4,4,1,3,3,4,['Technical']),
W('The Warden',5,6,2,5,3,2,['Giant'],[{k:'def',n:1}]),
W('Cobra Quinn',5,3,1,3,3,3,['Technical'],[{k:'perPower',s:'atk',n:1}]),
W('Saint Rowan',4,6,2,4,2,2,['Veteran']),
W('Dynamo Dee',6,4,2,5,4,3,['High Flyer']),
W('Grizzly Pete',7,3,1,4,3,1,['Giant','Brawler']),
W('Phantom X',5,5,1,4,3,3,['Technical'],[{k:'vp',n:1}]),
W('Hurricane Hana',4,3,0,2,2,3,['High Flyer']),
W('Old Boy Gus',3,5,1,2,2,2,['Veteran'],[{k:'def',n:1,tag:'Veteran'}]),
W('Titan Okoro',8,2,3,6,5,1,['Giant']),
W('Slick Rick Rivers',3,4,0,2,2,5,['Technical'])];
const DEF_P=[
P('Steel Chair','Weapon',[{k:'atk',n:2}]),
P('Barbed Bat','Weapon',[{k:'atk',n:3}]),
P('Cage Match','Match Type',[{k:'def',n:2},{k:'atk',n:1}]),
P('Ladder Match','Match Type',[{k:'atk',n:2,tag:'High Flyer'}]),
P('Street Fight','Match Type',[{k:'atk',n:2,tag:'Brawler'}]),
{...P('Slick Manager','Manager',[{k:'win',n:2}]),keep:true},
{...P('Mastermind','Manager',[{k:'perPower',s:'atk',n:1}]),keep:true},
P('Hard Ref','Referee',[{k:'def',n:2}]),
P('Fast Count','Referee',[{k:'atk',n:2}]),
P('Sleeper Hold','Action',[{k:'atk',n:2,tag:'Technical'}]),
P('Brick Wall','Action',[{k:'def',n:3}]),
P('Crowd Pop','Action',[{k:'win',n:3}]),
P('Veteran Savvy','Action',[{k:'def',n:2,tag:'Veteran'}]),
P('Title Shot','Action',[{k:'atk',n:1},{k:'def',n:1}]),
P('Backstage Deal','Action',[{k:'draw',n:2}]),
{...P('Sabotage','Action',[]),rules:[{when:'reveal',mode:'all',if:[{c:'oppPower',n:1}],do:[{a:'discard',n:1,who:'opp'},{a:'cash',n:2,ifPrev:true}]}]},
{...P('Role Reversal','Action',[]),rules:[{when:'reveal',mode:'all',if:[],do:[{a:'swap'},{a:'steal',v:'Chair',n:0}]}]}];
const DEF_E=[
{n:'Rising Stars',cash:12,inc:2,hyp:1,fx:[]},
{n:'Old Guard Wrestling',cash:16,inc:1,hyp:0,fx:[{k:'def',n:1,tag:'Veteran'}]},
{n:'Hype Machine',cash:10,inc:2,hyp:2,fx:[]},
{n:'Brawl Co.',cash:14,inc:1,hyp:1,fx:[{k:'atk',n:1,tag:'Brawler'}]}];

// ---------- CONFIG / HELPERS ----------
const MAX_PW=3; // max power cards attached to one wrestler in a match
const maxPw=e=>Math.max(MAX_PW,...[...(e.c.fx||[]),...e.pw.flatMap(x=>x.fx||[]),...((G.pl[e.p].efed||{}).fx||[])].filter(f=>f.k==='pwLimit').map(f=>+f.n||0)); // 'pwLimit' effect raises the cap for that wrestler
const SLOTS=[3,3,4,4,5,5,6,8]; // matches per show
const HV=1, MAXR=8; // cash value of one hype token; number of shows
const sh=a=>a.map(x=>[Math.random(),x]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);
const cl=o=>JSON.parse(JSON.stringify(o));
const fxT=f=>({atk:`+${f.n} ATK`,def:`+${f.n} DEF`,win:`+$${f.n} win`,perPower:`+${f.n} ${(f.s||'').toUpperCase()} per attached power`,vp:`+${f.n} VP at end`,draw:`Draw ${f.n} power card${f.n>1?'s':''}`,pwLimit:`Your Power Card limit for this match is ${f.n}.`}[f.k])+(f.tag?` if ${f.tag}`:'');
const me=()=>G.pl[G.cur];
let G;
// ---------- CARD DATABASE (editable in the in-game Card Editor, saved in this browser) ----------
const LS='wtcg_cards_v2';
const TC={Brawler:'#a8372d',Technical:'#3f6f9a',Giant:'#6d4a96','High Flyer':'#2a8f86',Veteran:'#a98a3c',Heel:'#8c2a3a',Face:'#2a6f9c'};
const tagC=t=>!t?'var(--w)':TC[t]||`hsl(${[...t].reduce((a,ch)=>(a*31+ch.charCodeAt(0))%360,7)} 40% 40%)`;
const norm=c=>{const o={fx:[],rules:[],txt:'',img:'',...c}; // repairs older or damaged saved cards
 o.fx=(Array.isArray(o.fx)?o.fx:[]).filter(x=>x&&typeof x==='object');
 o.rules=(Array.isArray(o.rules)?o.rules:[]).filter(r=>r&&typeof r==='object').map(r=>({mode:'all',...r,if:Array.isArray(r.if)?r.if.filter(Boolean):[],do:Array.isArray(r.do)?r.do.filter(Boolean):[]}));
 if(o.atk!==undefined)o.tags=Array.isArray(o.tags)?o.tags:String(o.tags||'').split(',').map(t=>t.trim()).filter(Boolean);
 return o};
// cards.js (next to this file) holds the published card set: window.CARDS={wr:[],pw:[],ef:[]}. Without it, the built-in cards are used.
const PUB=(typeof window!=='undefined'&&window.CARDS&&window.CARDS.wr&&window.CARDS.pw&&window.CARDS.ef)?window.CARDS:null;
const fromObj=o=>({wr:o.wr.map(norm),pw:o.pw.map(norm),ef:o.ef.map(norm)});
const builtinDB=()=>({wr:DEF_W.map(({hype,champ,...r})=>norm(r)),pw:cl(DEF_P).map(norm),ef:cl(DEF_E).map(norm)});
const defDB=()=>PUB?fromObj(cl(PUB)):builtinDB();
let EDIT=typeof location==='undefined'||location.protocol==='file:'||/[?&]edit/.test(location.search)||(()=>{try{return localStorage.getItem('wtcg_edit')==='1'}catch(e){return false}})();
// secret unlock for the editor: tap the title 5 times, or press Ctrl+Shift+E (remembered in this browser)
function unlockEd(){EDIT=true;try{localStorage.setItem('wtcg_edit','1')}catch(e){}ui();toast('Card editor unlocked')}
let tapN=0,tapT;function titleTap(){tapN++;clearTimeout(tapT);tapT=setTimeout(()=>tapN=0,1500);if(tapN>=5){tapN=0;unlockEd()}}
document.addEventListener('keydown',e=>{if(e.ctrlKey&&e.shiftKey&&e.key.toLowerCase()==='e')unlockEd()}); // editor button: always on your computer, on the public site only with ?edit
function loadDB(){try{const s=JSON.parse(localStorage.getItem(LS));if(s&&s.wr&&s.pw&&s.ef)return{wr:s.wr.map(norm),pw:s.pw.map(norm),ef:s.ef.map(norm)}}catch(e){}return defDB()}
let DB=loadDB();
function persist(){try{localStorage.setItem(LS,JSON.stringify(DB));return true}catch(e){toast('Storage full: use smaller images or Export JSON');return false}}
let toastT;function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),2200)}

// ---------- SETUP ----------
function newGame(){
 const exp=(a,n)=>a.flatMap(c=>Array(c.copies||n).fill(c)),wd=sh(cl(exp(DB.wr,3).map(c=>({...c,hype:0,champ:false})))), pd=sh(cl(exp(DB.pw,2))), ed=sh(cl(DB.ef));
 const pl=[0,1].map(()=>({cash:0,inc:0,hyp:0,tok:0,vp:0,hand:[],pw:pd.splice(0,3),signed:[],efed:null,opts:ed.splice(0,2),done:false,passed:false,last:null}));
 G={ph:'efed',cur:0,ready:false,wd,pd,disc:[],market:[],pool:[],round:1,pl,slots:[],log:'',sel:null,scouted:null};
 ui();
}
function pickEfed(i){const p=me(),e=p.opts[i];p.efed=e;p.cash+=e.cash;p.inc+=e.inc;p.hyp+=e.hyp;p.opts=[];
 if(G.cur===0){G.cur=1;G.ready=false;ui();}else startDraft();}

// ---------- DRAFT ----------
function startDraft(){
 if(G.wd.length<10){G.wd.push(...sh(G.disc.filter(c=>c.atk)));G.disc=G.disc.filter(c=>!c.atk);}
 G.pool=G.wd.splice(0,10);
 G.pl.forEach(p=>{p.done=false;p.picks=0});
 G.ph='draft';G.cur=(G.round-1)%2;G.ready=false;autoDone();
}
function autoDone(){
 G.pl.forEach(p=>{if(!G.pool.some(c=>c.cost<=p.cash))p.done=true});
 if(G.pl.every(p=>p.done)||!G.pool.length){G.disc.push(...G.pool);G.pool=[];return startShow();}
 if(me().done){G.cur=1-G.cur;G.ready=false}
 ui();
}
function draft(i){const p=me(),c=G.pool.splice(i,1)[0];p.cash-=c.cost;p.signed.push(c);p.hand.push(c);p.picks++;nextDraft();}
function stopDraft(){me().done=true;nextDraft();}
function nextDraft(){const o=1-G.cur;if(!G.pl[o].done){G.cur=o;G.ready=false}autoDone();}

// ---------- SHOW ----------
function startShow(){
 G.slots=Array.from({length:SLOTS[G.round-1]||6},()=>({atk:null,def:null}));
 G.pl.forEach(p=>{p.passed=false;p.last=null});
 G.ph='show';G.cur=(G.round-1)%2;G.ready=false;G.sel=null;G.step=null;G.scouted=null;ui();
}
function endTurn(){
 G.sel=null;if(G.step!=='board')G.step=null;
 if(G.pl[0].passed&&G.pl[1].passed)return resolve();
 const o=1-G.cur; if(!G.pl[o].passed){G.cur=o;G.ready=false}
 ui();
}
function play(si){
 const p=me(),c=p.hand.splice(G.sel.i,1)[0],s=G.slots[si],role=s.atk?'def':'atk';
 s[role]={p:G.cur,c,pw:[]};p.last=s[role];c.fx.forEach(f=>{if(f.k==='draw'&&(!f.tag||c.tags.includes(f.tag)))drawP(p,f.n)});
 if(c.champ&&si===G.slots.length-1)p.tok++;
 endTurn();
}
function attach(si,r){const p=me(),pc=p.pw.splice(G.sel.i,1)[0],e=G.slots[si][r];e.pw.push(pc);p.last=e;pc.fx.forEach(f=>{if(f.k==='draw'&&(!f.tag||e.c.tags.includes(f.tag)))drawP(p,f.n)});endTurn();}
function drawPower(){if(!G.pd.length){G.pd=sh(G.disc.filter(c=>c.cat));G.disc=G.disc.filter(c=>!c.cat);}
 if(G.pd.length)me().pw.push(G.pd.shift());endTurn();}
function scoutDeck(){if(!G.wd.length)return;G.scouted=G.wd.shift();ui();}
function buy(src,i){const p=me(),c=src==='s'?G.scouted:G.market.splice(i,1)[0];p.cash-=c.cost;p.hand.push(c);G.scouted=null;endTurn();}
function toMarket(){G.market.push(G.scouted);if(G.market.length>5)G.disc.push(G.market.shift());G.scouted=null;endTurn();}
function pass(){me().passed=true;endTurn();}

// ---------- RESOLUTION (one match at a time, animated) ----------
let ANIM_SPEED=1; // 0 = instant, 1 = normal, 2 = slower
const who=p=>AI[p]?'Opponent':'Player '+(p+1);
const winT=p=>AI.some(Boolean)?(AI[p]?'Opponent wins':'You win'):who(p)+' wins'; // 'You' only makes sense with one human
function drawP(p,n){let d=0;for(let k=0;k<n;k++){if(!G.pd.length){G.pd=sh(G.disc.filter(c=>c.cat));G.disc=G.disc.filter(c=>!c.cat)}if(!G.pd.length)break;p.pw.push(G.pd.shift());d++}return d}
function calc(e,role){
 const p=G.pl[e.p],w=e.c;
 const fx=[...w.fx.map(f=>({f,src:w.n})),...e.pw.flatMap(x=>x.fx.map(f=>({f,src:x.n}))),...(p.efed.fx||[]).map(f=>({f,src:p.efed.n})),...(e.xs||[]).map(x=>({f:{k:x.k,n:x.n},src:x.src}))];
 let v=role==='atk'?w.atk:w.def,win=w.win;
 const st=[{t:`${w.n} base ${role==='atk'?'attack':'defense'}`,n:v,run:v}],ws=[{t:'base',n:w.win}];
 fx.forEach(({f,src})=>{if(f.tag&&!w.tags.includes(f.tag))return;
  if(f.k===role){v+=f.n;st.push({t:`${src}: ${fxT(f)}`,n:f.n,run:v})}
  if(f.k==='perPower'&&f.s===role){const n=f.n*e.pw.length;if(n){v+=n;st.push({t:`${src}: ${e.pw.length} attached`,n,run:v})}}
  if(f.k==='win'){win+=f.n;ws.push({t:src,n:f.n})}});
 return{v,win,st,ws};
}
function done(e){const o=G.pl[e.p];e.pw.forEach(x=>x.keep?o.pw.push(x):G.disc.push(x));o.hand.push(e.c);}
function resolveOne(i,pre=[]){
 const s=G.slots[i],main=i===G.slots.length-1,r={i,main};
 if(!s.def){
  const e=s.atk,p=G.pl[e.p],tok=p.tok;
  Object.assign(r,{kind:'promo',ec:cl(e.c),pw:e.pw.map(x=>x.n),winner:e.p,promo:e.c.promo,tok});
  p.cash+=r.promo;r.drew=drawP(p,1);e.c.hype+=tok;p.tok=0;r.hype=e.c.hype;
  G.sum.push(`Match ${i+1}: PROMO by ${who(e.p)} ${e.c.n}, +$${r.promo}`);done(e);return r;}
 const ea=s.swap?s.def:s.atk,ed=s.swap?s.atk:s.def,A=calc(ea,'atk'),D=calc(ed,'def'),aw=(A.v>D.v)!==!!s.flip,w=aw?ea:ed,W=aw?A:D,wp=G.pl[w.p]; // ea/ed = who acts as attacker/defender (roles may be switched)
 Object.assign(r,{kind:'match',ac:cl(ea.c),dc:cl(ed.c),ap:ea.p,dp:ed.p,apw:ea.pw.map(x=>x.n),dpw:ed.pw.map(x=>x.n),A,D,aw,wn:w.c.n,wp:w.p,tie:A.v===D.v,flipped:!!s.flip,lines:[]});
 wp.cash+=W.win;let got=W.win;
 r.lines.push(`Win payout +$${W.win}`+(W.ws.length>1?` (${W.ws.map(x=>x.n).join(' + ')})`:''));
 const hy=(s.atk.c.hype+s.def.c.hype)*HV;
 if(hy){wp.cash+=hy;got+=hy;r.lines.push(`Hype tokens cashed in +$${hy}`);s.atk.c.hype=0;s.def.c.hype=0;}
 if(s.atk.c.champ||s.def.c.champ||(main&&G.round===1)){s.atk.c.champ=false;s.def.c.champ=false;w.c.champ=true;wp.vp+=3;r.lines.push('Takes the championship token +3 VP');}
 G.sum.push(`Match ${i+1}: ${who(w.p)} ${w.c.n} wins (${A.v} vs ${D.v}), +$${got}${r.lines.length>(hy?2:1)?', +3 VP':''}`);
 const lo=aw?ed:ea,wr=aw?'atk':'def',lr=aw?'def':'atk';
 runRules('win',w,lo,{trig:'win',role:wr,main,lines:r.lines},()=>{});runRules('lose',lo,w,{trig:'lose',role:lr,main,lines:r.lines},()=>{});
 r.lines.unshift(...pre);
 done(s.atk);done(s.def);return r;
}
function resolve(){
 G.ph='resolve';G.rq=G.slots.map((x,i)=>(x.atk||x.def)?i:-1).filter(i=>i>=0);G.rn=0;G.res=null;G.sum=[];G.eos=[];G.fin=false;ui();
}
function nextMatch(){
 if(G.rn>=G.rq.length)return finishShow();
 const i=G.rq[G.rn++],s=G.slots[i],pre=[];G.res=null;
 const go=()=>{G.res=resolveOne(i,pre);ui()};
 if(!s.def)return go();
 const cx=isA=>({trig:'reveal',get role(){return isA!==!!s.swap?'atk':'def'},main:i===G.slots.length-1,lines:pre,slot:s});
 runRules('reveal',s.atk,s.def,cx(true),()=>runRules('reveal',s.def,s.atk,cx(false),()=>askFlip(s,pre,go)));
}
function finishShow(){
 G.eos=G.pl.map((p,i)=>{p.cash+=p.inc;p.tok+=p.hyp;const d=drawP(p,3+(p.efed.fx||[]).filter(f=>f.k==='draw').reduce((a,f)=>a+f.n,0));const ex=[];runRules('endshow',{p:i,c:{n:p.efed.n,tags:[],rules:[]},pw:[]},null,{trig:'endshow',lines:ex},()=>{});return `${who(i)}: +$${p.inc} merch income, +${p.hyp} hype tokens, drew ${d} power cards`+(ex.length?' · '+ex.join(', '):'')});
 G.fin=true;G.res=null;ui();
}
function nextShow(){G.round++;if(G.round>MAXR){G.ph='end';ui();}else startDraft();}

// ---------- UI ----------
const ENABLE_SCOUT=false, ENABLE_DRAW=false; // turn on later
let AI=[false,true],SHOW_TXT=false,ART_ONLY=true; // ART_ONLY: cards that have real art show only the picture (their art already prints name and stats) // SHOW_TXT: print power text on wrestler/eFed faces // which players are AI (set both false for hot-seat)
let aiT;
const score=p=>p.vp+[...new Set([...p.signed,...p.hand])].reduce((s,c)=>s+c.vp+c.fx.filter(f=>f.k==='vp').reduce((a,f)=>a+f.n,0),0);
const chip=t=>`<span class="chip">${t}</span>`;
const IMG_BASE='images/',IMG_EXT='.png'; // card art: images/<card-name-slug>.png, e.g. images/iron-mako.png
const slug=n=>n.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
function cardH(c,o={}){
 const w=c.atk!==undefined,e=c.cash!==undefined,k=w?tagC((c.tags||[])[0]):e?'var(--e)':'var(--p)';
 const src=c.img||IMG_BASE+slug(c.n)+IMG_EXT;
 const fx=(c.txt?c.txt.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/\n/g,'<br>'):[...(c.fx||[]).map(fxT),...(c.rules||[]).map(ruleT)].filter(Boolean).join('<br>'))+(c.keep?'<br><i>Returns to hand after use</i>':'');
 return `<div class="cw"><div class="c ${e?'ef ':''}${o.sel?'sel':''} ${o.off?'off':''} ${c.champ?'champ':''}" style="--k:${k}"><div class="im"><span>${c.n[0]}</span><img src="${src}" alt="" onerror="this.remove()"></div><div class="top">${w?`<i class="coin" title="Signing cost">${c.cost}</i>`:''}<b>${c.n}</b>${w?`<span class="tg">${[...(c.align?[c.align[0].toUpperCase()+c.align.slice(1)]:[]),...c.tags].map(t=>`<em>${t}</em>`).join('')}</span>`:''}</div>${w?`<div class="stat a" title="Attack">⚔ <b>${c.atk}</b></div><div class="stat d" title="Defense"><b>${c.def}</b> 🛡</div>`:''}${c.champ?'<div class="flag cr">★ CHAMPION</div>':''}${c.hype?`<div class="flag hy">🔥 ${c.hype}</div>`:''}<div class="tx">${c.cat?`<small>${c.cat}</small>`:''}${w?`<div class="pay"><span>🏆 Win $${c.win}</span><span>🎤 Promo $${c.promo}</span></div>`:''}${e?`<div class="pay"><span>💵 $${c.cash}</span><span>📈 +${c.inc}</span><span>🔥 +${c.hyp}</span></div>`:''}${fx&&(SHOW_TXT||!(w||e))?`<p>${fx}</p>`:''}</div>${w&&c.vp?`<i class="vps" title="Victory points">${c.vp}</i>`:''}</div>${o.btn?`<div class="bt">${o.btn}</div>`:''}</div>`;
}

 const p=G.pl[e.p],n=+a.n||0,L=ctx.lines;
 if(a.a==='stat'){if(ctx.trig!=='reveal')return cb(false);(e.xs=e.xs||[]).push({k:a.k==='def'?'def':'atk',n,src});return cb(true)}
 if(a.a==='swap'){if(ctx.trig!=='reveal'||!ctx.slot||!opp)return cb(false);ctx.slot.swap=!ctx.slot.swap;L.push(`${src}: roles are switched in this match`);return cb(true)}
 if(a.a==='steal'){
  if(ctx.trig!=='reveal'||!opp)return cb(false);
  const q=String(a.v||'').trim().toLowerCase();if(!q)return cb(false);
  let left=n>0?n:99,got=0;
  for(let i=0;i<opp.pw.length&&left>0;){const c=opp.pw[i];
   if([c.n,c.cat].some(x=>String(x||'').toLowerCase().includes(q))){opp.pw.splice(i,1);left--;got++;
    if(e.pw.length<maxPw(e)){e.pw.push(c);L.push(`${src}: took ${c.n} and attached it to ${e.c.n}`)}else{G.disc.push(c);L.push(`${src}: took ${c.n} but there was no room, so it was discarded`)}}
   else i++}
  return cb(got>0)}
 if(a.a==='flip')return cb(false); // flip is offered before the result is paid out (see askFlip)
 if(a.a==='cash'){p.cash+=n;L.push(`${src}: gain $${n}`);return cb(n>0)}
 if(a.a==='opCash'){const o=G.pl[1-e.p],t=Math.min(n,o.cash);o.cash-=t;p.cash+=t;L.push(`${src}: took $${t} from ${who(1-e.p)}`);return cb(t>0)}
 if(a.a==='vp'){p.vp+=n;L.push(`${src}: +${n} VP`);return cb(n>0)}
 if(a.a==='draw'){const d=drawP(p,n);L.push(`${src}: drew ${plural(d,'power card')}`);return cb(d>0)}
 if(a.a==='discard'){
  if(ctx.trig!=='reveal'||!opp||!opp.pw.length)return cb(false);
  let k=Math.min(n||1,opp.pw.length),got=0;
  const one=()=>{
   if(k--<=0||!opp.pw.length)return cb(got>0);
   const ch=a.who==='me'?e.p:a.who==='random'?-1:opp.p;
   const fin=i=>{const c=opp.pw.splice(i,1)[0];G.disc.push(c);got++;L.push(`${src}: ${c.n} discarded`);one()};
   if(ch<0)return fin(Math.floor(Math.random()*opp.pw.length));
   if(AI[ch]){const sc=c=>c.fx.reduce((t,f)=>t+f.n,0)+(c.rules||[]).length*2,o=opp.pw.map((c,i)=>[sc(c),i]).sort((x,y)=>ch===opp.p?x[0]-y[0]:y[0]-x[0]);return fin(o[0][1])}
   G.pend={chooser:ch,owner:opp.p,src,cards:[...opp.pw],cb:fin};ui()};
  return one()}
 cb(false)}
function askFlip(s,pre,go){
 const main=G.slots.indexOf(s)===G.slots.length-1;
 const ea=s.swap?s.def:s.atk,ed=s.swap?s.atk:s.def,A=calc(ea,'atk'),D=calc(ed,'def'),aw=A.v>D.v;
 const W=aw?ea:ed,L=aw?ed:ea,WC=aw?A:D,LC=aw?D:A,wr=aw?'atk':'def',lr=aw?'def':'atk';
 const hy=(s.atk.c.hype+s.def.c.hype)*HV,ch=(s.atk.c.champ||s.def.c.champ||(main&&G.round===1))?9:0;
 const Rw=WC.win+hy+ch,Rl=LC.win+hy+ch; // rough reward value of each side winning (a VP counts as 3)
 const find=(e,opp,trig,role)=>{const p=G.pl[e.p],ctx={trig,role,main,lines:[]};
  for(const [r,src] of [...(e.c.rules||[]).map(r=>[r,e.c.n]),...e.pw.flatMap(x=>(x.rules||[]).map(r=>[r,x.n])),...((p.efed&&p.efed.rules)||[]).map(r=>[r,p.efed.n])]){
   if(r.when!==trig||!condOK(r,e,opp,ctx))continue;
   const a=(r.do||[]).find(x=>x.a==='flip');if(a)return{e,src,n:+a.n||0,win:trig==='win'}}
  return null};
 const offers=[find(W,L,'win',wr),find(L,W,'lose',lr)].filter(Boolean);
 let k=0;
 const next=()=>{
  if(k>=offers.length)return go();
  const o=offers[k++];
  const yes=ok=>{if(!ok)return next();s.flip=true;G.pl[o.e.p].vp+=o.n;pre.push(`${o.src}: ${who(o.e.p)} chose to flip the result`+(o.n?` (${o.n>0?'+':''}${o.n} VP)`:''));go()};
  if(AI[o.e.p])return yes((o.win?-1:1)*(Rw+Rl)+3*o.n>0);
  G.pend={kind:'flip',chooser:o.e.p,src:o.src,n:o.n,win:o.win,cb:yes};ui()};
 next()}
function choosePend(k){const q=G.pend;G.pend=null;q.cb(k)}
function pendH(){const q=G.pend,own=q.chooser===q.owner;
 if(q.kind==='flip')return `<div class="bar">FLIP THE RESULT?<span>${who(q.chooser)}</span></div><p class="hint big">${esc(q.src)}: ${who(q.chooser)}, ${q.win?'you won this match. Choose to lose instead':'you lost this match. Choose to win instead'}${q.n?` and ${q.n>0?'gain '+q.n:'lose '+(-q.n)} VP`:''}? Everything flips, rewards included.</p><div class="acts"><button onclick="choosePend(true)">Yes, flip it</button><button class="ghost" onclick="choosePend(false)">No, keep the result</button></div>`;
 return `<div class="bar">DISCARD A POWER CARD<span>${who(q.chooser)}</span></div><p class="hint big">${esc(q.src)}: ${who(q.chooser)}, ${own?'choose one of your power cards in this match to discard.':'choose one of the opponent power cards (face-down) to discard.'}</p><div class="row">${q.cards.map((c,k)=>own?cardH(c,{btn:`<button onclick="choosePend(${k})">Discard this</button>`}):`<div class="cw"><div class="c back"><b>?</b><small>face-down</small></div><div class="bt"><button onclick="choosePend(${k})">Discard this</button></div></div>`).join('')}</div>`}

// ---- editor: rule builder ----
const opts=(o,v)=>Object.keys(o).map(k=>`<option value="${k}" ${v===k?'selected':''}>${o[k]}</option>`).join('');
const cleanC=d=>{d.fx=(d.fx||[]).filter(x=>x.k);d.rules=(d.rules||[]).map(r=>({...r,if:(r.if||[]).filter(c=>c.c),do:(r.do||[]).filter(a=>a.a)})).filter(r=>r.when&&r.do.length);return d};
const condRow=(c,j,x)=>{const k=c.c;return `<div class="fxr"><label class="chk"><input type="checkbox" ${c.not?'checked':''} onchange="edCS(${j},${x},'not',this.checked)"> NOT</label><select onchange="edCS(${j},${x},'c',this.value)"><option value="">Choose condition…</option>${opts(CND,k)}</select>${['oppPower','myPower','cash'].includes(k)?`<input type="number" min="0" value="${c.n??1}" oninput="edCS(${j},${x},'n',this.value)">`:''}${['tag','oppTag'].includes(k)?`<input type="text" placeholder="tag name" value="${esc(c.v||'')}" oninput="edCS(${j},${x},'v',this.value)">`:''}${['oppAlign','myAlign'].includes(k)?`<select onchange="edCS(${j},${x},'v',this.value)"><option value="heel" ${c.v!=='face'?'selected':''}>Heel</option><option value="face" ${c.v==='face'?'selected':''}>Face</option></select>`:''}${k==='role'?`<select onchange="edCS(${j},${x},'v',this.value)"><option value="atk" ${c.v!=='def'?'selected':''}>attacking</option><option value="def" ${c.v==='def'?'selected':''}>defending</option></select>`:''}<button class="ghost" onclick="edCDel(${j},${x})">✕</button></div>`};
const actRow=(a,j,x)=>{const k=a.a;return `<div class="fxr">${x?`<label class="chk"><input type="checkbox" ${a.ifPrev?'checked':''} onchange="edAS(${j},${x},'ifPrev',this.checked)"> only if previous worked</label>`:''}<select onchange="edAS(${j},${x},'a',this.value)"><option value="">Choose action…</option>${opts(ACT,k)}</select>${k==='stat'?`<select onchange="edAS(${j},${x},'k',this.value)"><option value="atk" ${a.k!=='def'?'selected':''}>ATK</option><option value="def" ${a.k==='def'?'selected':''}>DEF</option></select>`:''}${k&&k!=='swap'?`<input type="number" min="0" title="${k==='steal'?'0 = take every match':''}" value="${a.n??1}" oninput="edAS(${j},${x},'n',this.value)">`:''}${k==='steal'?`<input type="text" placeholder="name or category contains (e.g. Chair)" value="${esc(a.v||'')}" oninput="edAS(${j},${x},'v',this.value)"><small class="hint">number 0 = take every match</small>`:''}${k==='discard'?`<select onchange="edAS(${j},${x},'who',this.value)"><option value="opp" ${a.who!=='me'&&a.who!=='random'?'selected':''}>opponent chooses</option><option value="me" ${a.who==='me'?'selected':''}>I choose</option><option value="random" ${a.who==='random'?'selected':''}>random</option></select>`:''}${k==='flip'?'<small class="hint">VP if flipped (negative = lose VP). Use with WHEN: wins / loses.</small>':''}<button class="ghost" onclick="edADel(${j},${x})">✕</button></div>`};
const ruleRow=(r,j)=>`<div class="rule"><div class="rh"><b>WHEN</b><select onchange="edRS(${j},'when',this.value)"><option value="">Choose a trigger…</option>${opts(WHEN,r.when)}</select><button class="ghost" onclick="edRuleDel(${j})">Delete rule</button></div><div class="rb"><b>IF</b><select onchange="edRS(${j},'mode',this.value)"><option value="all" ${r.mode!=='any'?'selected':''}>ALL of these are true</option><option value="any" ${r.mode==='any'?'selected':''}>ANY of these is true</option></select>${(r.if||[]).map((c,x)=>condRow(c,j,x)).join('')}<button class="ghost" onclick="edCond(${j})">+ Add condition</button><small class="hint">No conditions means the rule always runs.</small></div><div class="rb"><b>DO</b>${(r.do||[]).map((a,x)=>actRow(a,j,x)).join('')}<button class="ghost" onclick="edAct(${j})">+ Add action</button></div>${ruleT(cleanC({rules:[cl(r)]}).rules[0]||{})?`<div class="hint">Reads as: ${esc(ruleT(cleanC({rules:[cl(r)]}).rules[0]))}</div>`:''}</div>`;
const R=j=>ED.d.rules[j];
function edRule(){ED.d.rules=ED.d.rules||[];ED.d.rules.push({when:'',mode:'all',if:[],do:[]});edRender()}
function edRuleDel(j){ED.d.rules.splice(j,1);edRender()}
function edRS(j,k,v){R(j)[k]=v;edRender()}
function edCond(j){R(j).if.push({c:'',n:1});edRender()}
function edCS(j,x,k,v){const c=R(j).if[x];if(k==='n')c.n=+v||0;else c[k]=v;if(k==='c'){c.v=['oppAlign','myAlign'].includes(v)?'heel':'';edRender()}else edPrev()}
function edCDel(j,x){R(j).if.splice(x,1);edRender()}
function edAct(j){R(j).do.push({a:'',n:1});edRender()}
function edAS(j,x,k,v){const a=R(j).do[x];if(k==='n')a.n=+v||0;else a[k]=v;if(k==='a'){a.who='opp';a.k='atk';if(v==='steal'){a.n=0;a.v=''}if(v==='flip')a.n=1;edRender()}else edPrev()}
function edADel(j,x){R(j).do.splice(x,1);edRender()}

// ---------- CARD EDITOR ----------
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
// Effect kinds the engine understands. To add a NEW kind, ask Claude: "please wire this card" and paste the exported JSON.
const FXK={atk:'+ ATK',def:'+ DEF',win:'+ $ when this wrestler wins',perPower:'+ per attached power card',vp:'+ VP at game end',draw:'Draw power cards (on play or attach; eFeds: every show)',pwLimit:'Power card limit for this wrestler in a match (number = new limit)'};
const NEWC={wr:()=>({n:'New Wrestler',atk:4,def:4,vp:1,cost:3,win:3,promo:2,tags:[],fx:[],img:'',txt:'',copies:3}),
 pw:()=>({n:'New Power',cat:'Action',fx:[],txt:'',img:'',copies:2}),
 ef:()=>({n:'New eFed',cash:12,inc:1,hyp:1,fx:[],txt:'',img:''})};
const TABN={wr:'Wrestlers',pw:'Power cards',ef:'eFeds'};
let ED={tab:'wr',i:0,d:null};
function openEd(){$('ed').style.display='block';document.body.style.overflow='hidden';edSel(ED.tab,Math.min(ED.i,DB[ED.tab].length-1))}
function closeEd(){$('ed').style.display='none';document.body.style.overflow=''}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('ed').style.display==='block')closeEd()});
function edSel(t,i){ED.tab=t;ED.i=Math.max(0,i);ED.d=DB[t][ED.i]?cl(DB[t][ED.i]):null;edRender()}
function edRender(){try{edRender0()}catch(e){$('ed').innerHTML='<div class="edh"><h2>Editor problem</h2><button onclick="closeEd()">Close</button><button class="ghost" onclick="edReset()">Revert to published</button></div><p class="hint">Please send a screenshot of this message.</p><pre style="white-space:pre-wrap;color:#f99;padding:8px">'+esc(e&&e.stack||e)+'</pre>'}}
function edRender0(){
 const t=ED.tab,d=ED.d,un=c=>c.txt&&!(c.fx||[]).length&&!(c.rules||[]).length;
 let h=`<div class="edh"><h2>✎ Card editor</h2><div class="tabs">${Object.keys(TABN).map(x=>`<button class="${x===t?'':'ghost'}" onclick="edSel('${x}',0)">${TABN[x]} (${DB[x].length})</button>`).join('')}</div><span style="flex:1"></span><button class="ghost" onclick="edCopy()">Copy JSON</button><button class="ghost" onclick="edExport()">Export cards.js</button><button class="ghost" onclick="$('imp').click()">Import cards</button><button class="ghost" onclick="edReset()">Revert to published</button><button onclick="edApply()">Apply &amp; new game</button><button class="ghost" onclick="closeEd()" title="Close (Esc)">✕</button></div>`;
 h+=`<div class="edb"><div class="edl"><button onclick="edNew()">+ New card</button>${DB[t].map((c,i)=>`<div class="eli ${i===ED.i?'on':''}" onclick="edSel('${t}',${i})"><span>${esc(c.n)}</span>${un(c)?'<em title="Has power text but no effects yet. Ask Claude to wire it.">needs wiring</em>':''}</div>`).join('')}</div>`;
 h+=d?edForm(d):'<p class="hint">No cards here yet. Click + New card.</p>';
 $('ed').innerHTML=h+'</div>';edPrev();
}
function edForm(d){
 const t=ED.tab,f=(l,k,type='text',x='')=>`<label>${l}<input type="${type}" ${x} value="${esc(Array.isArray(d[k])?d[k].join(', '):d[k])}" oninput="edSet('${k}',this.value)"></label>`;
 let h=`<div class="edf"><div class="grid">${f('Name','n')}`;
 if(t==='wr')h+=f('Attack','atk','number','min=0')+f('Defense','def','number','min=0')+f('Signing cost','cost','number','min=0')+f('Victory points','vp','number','min=0')+f('Win payout $','win','number','min=0')+f('Promo payout $','promo','number','min=0')+f('Tags (comma separated)','tags')+`<label>Alignment<select onchange="edSet('align',this.value)"><option value="">None</option><option value="heel" ${d.align==='heel'?'selected':''}>Heel</option><option value="face" ${d.align==='face'?'selected':''}>Face</option></select></label>`+f('Gimmick tag','gimmick');
 if(t==='pw')h+=f('Category','cat')+`<label class="chk"><input type="checkbox" ${d.keep?'checked':''} onchange="edSet('keep',this.checked)"> Returns to hand after use</label>`;
 if(t==='ef')h+=f('Starting cash','cash','number')+f('Income per show','inc','number')+f('Hype tokens per show','hyp','number');
 h+=`</div><label>Power text (printed on the card)<textarea rows="3" placeholder="Leave empty to auto-write it from the effects below" oninput="edSet('txt',this.value)">${esc(d.txt)}</textarea></label>`;
 h+=`<div class="fxs"><b>Simple stat bonuses</b><small class="hint">Always-on bonuses while this card is on the board. The second box is optional: only if the wrestler has that tag. Leave empty for none.</small>${(d.fx||[]).map(fxRow).join('')}<button class="ghost" onclick="edFx()">+ Add effect</button></div><div class="fxs" style="width:100%"><b>Abilities (rules)</b><small class="hint">Build a rule: WHEN something happens, IF conditions are true, DO actions. Example: at reveal, if the opponent has power cards here, discard 1 (opponent chooses), then if that worked, gain $2.</small>${(d.rules||[]).map(ruleRow).join('')}<button class="ghost" onclick="edRule()">+ Add rule</button></div>`;
 h+=`<div class="img"><b>Art</b><div class="acts"><input type="file" accept="image/*" onchange="edImg(this)"><input type="text" placeholder="…or image path or URL (default: images/${slug(d.n)}.png)" value="${esc(d.img&&!d.img.startsWith('data:')?d.img:'')}" oninput="edSet('img',this.value)">${d.img?'<button class="ghost" onclick="edSet(\'img\',\'\');edRender()">Remove art</button>':''}</div></div>`;
 return h+`<div class="acts"><button onclick="edSave()">Save card</button><button class="ghost" onclick="edDup()">Duplicate</button><button class="ghost" onclick="edDel()">Delete</button></div></div><div class="edp"><div id="edp"></div></div>`;
}
const fxRow=(x,j)=>`<div class="fxr"><select onchange="edFxSet(${j},'k',this.value)"><option value="">Choose effect…</option>${Object.keys(FXK).map(k=>`<option value="${k}" ${x.k===k?'selected':''}>${FXK[k]}</option>`).join('')}</select><input type="number" value="${x.n}" oninput="edFxSet(${j},'n',this.value)">${x.k==='perPower'?`<select onchange="edFxSet(${j},'s',this.value)"><option value="atk" ${x.s!=='def'?'selected':''}>to ATK</option><option value="def" ${x.s==='def'?'selected':''}>to DEF</option></select>`:''}<input type="text" placeholder="only if wrestler has tag (optional)" value="${esc(x.tag||'')}" oninput="edFxSet(${j},'tag',this.value)"><button class="ghost" onclick="edFxDel(${j})">✕</button></div>`;
const NUMK=['atk','def','cost','vp','win','promo','copies','cash','inc','hyp'];
function edSet(k,v){ED.d[k]=k==='tags'?v.split(',').map(s=>s.trim()).filter(Boolean):NUMK.includes(k)?+v||0:v;edPrev()}
function edFx(){ED.d.fx.push({k:'',n:1});edRender()}
function edFxDel(j){ED.d.fx.splice(j,1);edRender()}
function edFxSet(j,k,v){const x=ED.d.fx[j];
 if(k==='n')x.n=+v||0;else if(k==='k'){x.k=v;if(v==='perPower')x.s=x.s||'atk';else delete x.s;edRender();return}
 else if(v==='')delete x[k];else x[k]=v;edPrev()}
function edPrev(){const p=$('edp');if(!p||!ED.d)return;try{p.innerHTML=cardH({...cleanC(cl(ED.d)),n:ED.d.n||'?',hype:0,champ:false})+'<p class="hint">Live preview</p>'}catch(e){p.innerHTML='<p class="hint">Preview unavailable: '+esc(e.message)+'</p>'}}
if(typeof window!=='undefined'&&window.addEventListener)window.addEventListener('error',e=>{try{toast('Error: '+e.message)}catch(_){}});
function edImg(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const s=Math.min(1,500/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);ED.d.img=c.toDataURL('image/jpeg',.82);edRender()};im.src=r.result};r.readAsDataURL(f)}
function edSave(){if(!ED.d.n.trim())return toast('Give the card a name');DB[ED.tab][ED.i]=cleanC(cl(ED.d));if(persist())toast('Saved '+ED.d.n);edRender()}
function edNew(){DB[ED.tab].push(norm(NEWC[ED.tab]()));persist();edSel(ED.tab,DB[ED.tab].length-1)}
function edDup(){const c=cl(ED.d);c.n+=' copy';DB[ED.tab].splice(ED.i+1,0,c);persist();edSel(ED.tab,ED.i+1)}
function edDel(){if(!confirm('Delete '+ED.d.n+'?'))return;DB[ED.tab].splice(ED.i,1);persist();edSel(ED.tab,ED.i-1)}
function edCopy(){navigator.clipboard.writeText(JSON.stringify(DB,null,1)).then(()=>toast('Card JSON copied'),()=>toast('Copy blocked: use Export file'))}
function edExport(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['window.CARDS='+JSON.stringify(DB,null,1)+';\n'],{type:'text/javascript'}));a.download='cards.js';a.click()}
function edImport(inp){const f=inp.files[0];if(!f)return;f.text().then(s=>{try{const o=JSON.parse(s.replace(/^\s*window\.CARDS\s*=\s*/,'').replace(/;\s*$/,''));if(!o.wr||!o.pw||!o.ef)throw 0;DB={wr:o.wr.map(norm),pw:o.pw.map(norm),ef:o.ef.map(norm)};persist();edSel('wr',0);toast('Imported')}catch(e){toast('That file is not a card export')}});inp.value=''}
function edReset(){if(!confirm('Discard your working copy and go back to the published cards?'))return;DB=defDB();localStorage.removeItem(LS);edSel(ED.tab,0)}
function edApply(){const n=DB.wr.reduce((a,c)=>a+(c.copies||3),0);
 if(n<10||DB.ef.length<4||!DB.pw.length)return alert('You need at least 10 wrestler copies, 4 eFeds and 1 power card to play.');
 persist();closeEd();newGame()}
if(document.body.classList)document.body.classList.add('artonly');
newGame();
</script></body></html>
