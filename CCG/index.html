<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wrestling Card Game (hot-seat)</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#070b14;--panel:#151c2b;--bg2:#10162a;--line:#2b3550;--ink:#e9e4da;--mute:#8f98b3;--acc:#ff7a3d;--gold:#f0c23c;--w:#d9632b;--p:#2f8fbf;--e:#e0b23a}
*{box-sizing:border-box}
body{margin:0;padding:14px;font:500 15px/1.45 Rajdhani,'Segoe UI',system-ui,sans-serif;color:var(--ink);background:radial-gradient(1.5px 1.5px at 12% 18%,#fff9 50%,#0000),radial-gradient(1px 1px at 38% 62%,#fff7 50%,#0000),radial-gradient(1.5px 1.5px at 71% 24%,#fff9 50%,#0000),radial-gradient(1px 1px at 88% 78%,#fff7 50%,#0000),radial-gradient(ellipse at 50% 120%,#5a1d12 0%,#0000 55%),linear-gradient(#070b14,#0e1424) fixed;min-height:100vh}
#app{max-width:1200px;margin:auto}
h1,h2,h3,.bar,.pn{font-family:Oswald,Impact,'Arial Narrow',sans-serif;font-weight:700;letter-spacing:1px}
h1{font-size:30px;letter-spacing:7px;text-align:center;margin:4px 0 10px}h1 span{color:var(--acc)}
h3{font-size:17px;margin:20px 0 6px;color:var(--acc);text-transform:uppercase}
.hint{color:var(--mute);margin:0 0 8px}.hint.big{font-size:20px;margin:22px 0}
.hud{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pp{background:linear-gradient(#18203366,#101626);border:2px solid var(--line);border-radius:12px;padding:8px 10px}
.pp.on{border-color:var(--acc);box-shadow:0 0 16px #ff7a3d55}
.pn{font-size:16px;display:flex;justify-content:space-between;align-items:baseline}
.pn small{font:500 13px Rajdhani,sans-serif;color:var(--mute);letter-spacing:0}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:6px}
.tile{background:#0a0e17;border:1px solid var(--line);border-radius:8px;text-align:center;padding:4px 2px}
.tile small{display:block;font-size:10px;color:var(--mute);letter-spacing:1.5px}
.tile b{font:700 22px Rajdhani,sans-serif;display:block;line-height:1.1}.tile i{font-style:normal;font-size:11px;color:#8fd98f}
.pills span{background:#0a0e17;border:1px solid var(--line);border-radius:12px;padding:2px 12px;font-size:16px}
button{font:inherit;font-weight:700;background:var(--acc);color:#1a0d05;border:0;padding:7px 16px;border-radius:20px;cursor:pointer;margin:2px 6px 2px 0;text-transform:uppercase;letter-spacing:.5px;font-size:13px}
button:hover:not(:disabled){filter:brightness(1.12)}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
button:disabled{background:#2a3047;color:#6c7490;cursor:not-allowed}
button.ghost{background:transparent;color:var(--ink);border:2px solid var(--line)}
.bar{display:flex;justify-content:space-between;align-items:center;margin:16px 0 8px;font-size:22px;text-transform:uppercase}
.bar span{font:700 13px Rajdhani,sans-serif;color:#1a0d05;background:var(--acc);padding:3px 14px;border-radius:14px;letter-spacing:.5px}
.row{display:flex;flex-wrap:wrap;gap:14px}
.cw{width:190px}
.c{position:relative;width:190px;height:285px;border:3px solid var(--k,var(--line));border-radius:12px;overflow:hidden;background:#0a0e17;box-shadow:0 4px 14px #000a;transition:transform .15s,box-shadow .15s}
.c:hover{transform:translateY(-4px);box-shadow:0 10px 22px #000c}
.c.sel{box-shadow:0 0 0 3px var(--acc),0 10px 22px #000c;transform:translateY(-6px)}
.c.off{opacity:.4;filter:grayscale(.6)}.c.champ{box-shadow:0 0 0 2px var(--gold),0 0 18px #f0c23caa}
.im{position:absolute;inset:0;background:radial-gradient(circle at 50% 35%,color-mix(in srgb,var(--k) 55%,#000),#0a0e17 75%);display:grid;place-items:center}
.im span{font:110px Oswald,Impact,sans-serif;color:#fff2}
.im img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.top{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;gap:6px;padding:5px 7px;min-height:32px;background:linear-gradient(var(--k),color-mix(in srgb,var(--k) 65%,#000));font:700 15px Rajdhani,'Segoe UI',sans-serif;color:#fff;text-shadow:0 1px 2px #0008}
.top b{flex:1;line-height:1.1}
.coin{flex:none;width:26px;height:26px;border-radius:50%;background:radial-gradient(#ffd96b,#c8921a);color:#3a2500;display:grid;place-items:center;font:700 14px Rajdhani,sans-serif;font-style:normal;border:2px solid #fff6}
.tg{display:flex;gap:3px;flex-wrap:wrap;justify-content:flex-end;max-width:68px}.tg em{font:600 9px Rajdhani,sans-serif;font-style:normal;background:#0007;border-radius:6px;padding:0 5px;text-transform:uppercase}
.stat{position:absolute;top:50px;display:flex;align-items:center;gap:3px;padding:2px 9px 2px 7px;font-size:13px;color:#fff;background:#b8332e;border:2px solid #fff5;border-left:0;border-radius:0 14px 14px 0;left:0}
.stat b{font:700 22px Rajdhani,sans-serif}
.stat.d{left:auto;right:0;padding:2px 7px 2px 9px;background:#2d6cc0;border:2px solid #fff5;border-right:0;border-radius:14px 0 0 14px}
.flag{position:absolute;right:6px;padding:1px 9px;border-radius:10px;font-weight:700;font-size:12px}
.flag.cr{top:88px;background:var(--gold);color:#2a1d00}.flag.hy{top:112px;background:#ff9a3d;color:#2a1200}
.tx{position:absolute;left:0;right:0;bottom:0;padding:16px 36px 7px 8px;background:linear-gradient(#0000,#0b0f1acc 22%,#0b0f1af2);font:500 12px/1.3 Rajdhani,'Segoe UI',sans-serif}
.tx small{display:block;text-transform:uppercase;letter-spacing:1px;color:var(--p);filter:brightness(1.5);font-size:10px}
.tx p{margin:3px 0 0;background:#ffffff14;border-radius:6px;padding:3px 6px}
.pay{display:flex;gap:8px;flex-wrap:wrap;font-weight:700;color:#ffe3a6;font-size:12px}
.vps{position:absolute;right:6px;bottom:6px;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font:700 16px Rajdhani,sans-serif;font-style:normal;color:#3a2500;background:radial-gradient(#ffd96b,#d89b22);border:2px solid #fff6}
.bt{margin-top:6px}.bt button{width:100%;margin:0}
.c.back{display:grid;place-items:center;align-content:center;background:repeating-linear-gradient(45deg,#1c2440 0 10px,#151b33 10px 20px);border-color:var(--line)}
.c.back b{font:56px Oswald,Impact,sans-serif;color:#fff3}.c.back small{color:var(--mute)}
.slots{display:flex;gap:14px;overflow-x:auto;padding:2px 2px 12px;scroll-snap-type:x proximity}
.slot{flex:none;scroll-snap-align:start;background:var(--bg2);border:2px solid var(--line);border-radius:12px;padding:8px 12px 12px}
.slot.main{border-color:var(--gold);box-shadow:0 0 18px #f0c23c33}
.sh{display:flex;align-items:center;gap:10px;margin-bottom:6px;font:700 16px Oswald,Impact,sans-serif;letter-spacing:1px}
.sh em{color:var(--gold);font-style:normal}.sh button{margin-left:auto}
.cols{display:grid;grid-template-columns:repeat(2,190px);gap:16px;zoom:.8}
.role{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--mute);margin-bottom:4px}
.empty{width:190px;height:285px;border:2px dashed var(--line);border-radius:12px;display:grid;place-items:center;color:var(--mute)}
.atts{margin-top:5px;display:flex;flex-wrap:wrap;gap:4px}.att{background:var(--p);color:#04121c;border-radius:10px;padding:0 9px;font-size:12px;font-weight:700}
.acts{display:flex;flex-wrap:wrap;align-items:center}
#log{white-space:pre-wrap;background:#05070f;border:1px solid var(--line);border-radius:10px;padding:12px;max-height:420px;overflow:auto;font:12px/1.55 ui-monospace,Consolas,monospace;margin:8px 0}
.pass{text-align:center;margin:12vh auto;max-width:420px;background:var(--panel);border:2px solid var(--acc);border-radius:16px;padding:30px}
.pass h2{font-size:28px;color:var(--acc);margin:0 0 12px;text-transform:uppercase}
.pv{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 10px}
.pt{flex:none;background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:4px 6px}
.pt.main{border-color:var(--gold)}.pt small{display:block;color:var(--mute);font-size:10px;letter-spacing:1px;margin-bottom:2px}
.pt>div{display:flex;gap:4px}
.mc{position:relative;width:62px;height:84px;border:2px solid var(--k,var(--line));border-radius:6px;overflow:hidden;background:#0a0e17;font-size:9px;line-height:1.1}
.mc.me{--k:var(--acc)}.mc.op{--k:var(--p)}
.mc .im span{font-size:30px}
.mc b{position:absolute;left:0;right:0;top:0;background:#000a;padding:1px 2px;font-weight:700;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;z-index:1}
.mc u{position:absolute;left:0;right:0;bottom:0;background:#000b;text-decoration:none;text-align:center;padding:1px 0;color:#ffe3a6;font-weight:700;z-index:1}
.mc i{position:absolute;right:2px;top:12px;background:var(--p);color:#04121c;border-radius:6px;padding:0 4px;font-style:normal;font-weight:700;z-index:1}
.mc.none{display:grid;place-items:center;text-align:center;border-style:dashed;color:var(--mute);background:none}
.mc.back{display:grid;place-items:center;background:repeating-linear-gradient(45deg,#1c2440 0 6px,#151b33 6px 12px);border-color:var(--line);font:700 22px Oswald,sans-serif;color:#fff4}
.sel-row{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap}
.arena{display:flex;flex-wrap:wrap;gap:26px;justify-content:center;align-items:flex-start;margin:10px 0}
.side{width:230px;text-align:center;transition:opacity .5s,filter .5s,transform .5s}
.side.win{transform:scale(1.04);filter:drop-shadow(0 0 16px var(--gold))}
.side.lose{opacity:.45;filter:grayscale(.7)}
.vs{align-self:center;font:700 34px Oswald,Impact,sans-serif;color:var(--acc)}
.flip{width:190px;height:285px;margin:0 auto;perspective:900px}
.flip .in{position:relative;width:100%;height:100%;transition:transform .9s cubic-bezier(.2,.8,.2,1);transform-style:preserve-3d}
.flip.on .in{transform:rotateY(180deg)}
.flip .f,.flip .b{position:absolute;inset:0;backface-visibility:hidden}
.flip .f{transform:rotateY(180deg)}
.rv{opacity:0;transform:translateY(8px);transition:opacity .4s,transform .4s}.rv.on{opacity:1;transform:none}
.calc{margin-top:10px;text-align:left}
.cl{display:flex;justify-content:space-between;gap:8px;background:#ffffff10;border-radius:6px;padding:3px 8px;margin:3px 0;font-size:13px}.cl b{color:var(--gold)}
.tot{font:700 46px Oswald,Impact,sans-serif;line-height:1;margin-top:6px}.tot.pop{animation:pop .4s}
@keyframes pop{0%{transform:scale(1.5);color:var(--gold)}100%{transform:scale(1)}}
.tl{font-size:11px;letter-spacing:2px;color:var(--mute)}
.verdict{text-align:center;font:700 20px Oswald,Impact,sans-serif;margin:14px 0 6px;letter-spacing:1px}
.verdict b{display:block;font-size:30px;color:var(--gold);margin-top:2px}
.rewards{display:flex;flex-direction:column;align-items:center;gap:6px}
.rw{background:linear-gradient(90deg,#f0c23c33,#f0c23c11);border:1px solid #f0c23c66;border-radius:20px;padding:4px 18px;font-weight:700}
</style></head><body><div id="app"></div>
<script>
// ---------- CARD DATA (placeholder test set; later loaded from Supabase) ----------
const W=(n,atk,def,vp,cost,win,promo,tags,fx=[],img='')=>({n,atk,def,vp,cost,win,promo,tags,fx,img,hype:0,champ:false});
const P=(n,cat,fx)=>({n,cat,fx});
const WRES=[
W('Iron Mako',6,3,2,4,3,2,['Brawler'],[{k:'atk',n:1,tag:'Brawler'}]),
W('Vex Valentine',4,5,1,3,2,3,['Technical'],[{k:'def',n:2,tag:'Technical'}]),
W('Big Tombstone',7,2,2,5,4,1,['Giant']),
W('Luna Blaze',5,4,1,3,3,3,['High Flyer'],[{k:'atk',n:2,tag:'High Flyer'}]),
W('Rex Hammer',5,5,3,6,4,2,['Brawler','Veteran']),
W('Kid Nitro',3,3,0,1,2,2,['High Flyer']),
W('Mad Dog Morgan',6,2,1,3,3,2,['Brawler'],[{k:'win',n:2}]),
W('Silk Sebastian',4,4,1,3,3,4,['Technical']),
W('The Warden',5,6,2,5,3,2,['Giant'],[{k:'def',n:1}]),
W('Cobra Quinn',5,3,1,3,3,3,['Technical'],[{k:'perPower',s:'atk',n:1}]),
W('Saint Rowan',4,6,2,4,2,2,['Veteran']),
W('Dynamo Dee',6,4,2,5,4,3,['High Flyer']),
W('Grizzly Pete',7,3,1,4,3,1,['Giant','Brawler']),
W('Phantom X',5,5,1,4,3,3,['Technical'],[{k:'vp',n:1}]),
W('Hurricane Hana',4,3,0,2,2,3,['High Flyer']),
W('Old Boy Gus',3,5,1,2,2,2,['Veteran'],[{k:'def',n:1,tag:'Veteran'}]),
W('Titan Okoro',8,2,3,6,5,1,['Giant']),
W('Slick Rick Rivers',3,4,0,2,2,5,['Technical'])];
const POW=[
P('Steel Chair','Weapon',[{k:'atk',n:2}]),
P('Barbed Bat','Weapon',[{k:'atk',n:3}]),
P('Cage Match','Match Type',[{k:'def',n:2},{k:'atk',n:1}]),
P('Ladder Match','Match Type',[{k:'atk',n:2,tag:'High Flyer'}]),
P('Street Fight','Match Type',[{k:'atk',n:2,tag:'Brawler'}]),
{...P('Slick Manager','Manager',[{k:'win',n:2}]),keep:true},
{...P('Mastermind','Manager',[{k:'perPower',s:'atk',n:1}]),keep:true},
P('Hard Ref','Referee',[{k:'def',n:2}]),
P('Fast Count','Referee',[{k:'atk',n:2}]),
P('Sleeper Hold','Action',[{k:'atk',n:2,tag:'Technical'}]),
P('Brick Wall','Action',[{k:'def',n:3}]),
P('Crowd Pop','Action',[{k:'win',n:3}]),
P('Veteran Savvy','Action',[{k:'def',n:2,tag:'Veteran'}]),
P('Title Shot','Action',[{k:'atk',n:1},{k:'def',n:1}])];
const EFEDS=[
{n:'Rising Stars',cash:12,inc:2,hyp:1,fx:[]},
{n:'Old Guard Wrestling',cash:16,inc:1,hyp:0,fx:[{k:'def',n:1,tag:'Veteran'}]},
{n:'Hype Machine',cash:10,inc:2,hyp:2,fx:[]},
{n:'Brawl Co.',cash:14,inc:1,hyp:1,fx:[{k:'atk',n:1,tag:'Brawler'}]}];

// ---------- CONFIG / HELPERS ----------
const HV=1, MAXR=8; // cash value of one hype token; number of shows
const sh=a=>a.map(x=>[Math.random(),x]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);
const cl=o=>JSON.parse(JSON.stringify(o));
const fxT=f=>({atk:`+${f.n} ATK`,def:`+${f.n} DEF`,win:`+$${f.n} win`,perPower:`+${f.n} ${(f.s||'').toUpperCase()} per attached power`,vp:`+${f.n} VP at end`}[f.k])+(f.tag?` if ${f.tag}`:'');
const me=()=>G.pl[G.cur];
let G;

// ---------- SETUP ----------
function newGame(){
 const wd=sh(cl([...WRES,...WRES,...WRES])), pd=sh(cl([...POW,...POW])), ed=sh(cl(EFEDS));
 const pl=[0,1].map(()=>({cash:0,inc:0,hyp:0,tok:0,vp:0,hand:[],pw:pd.splice(0,2),signed:[],efed:null,opts:ed.splice(0,2),done:false,passed:false,last:null}));
 G={ph:'efed',cur:0,ready:false,wd,pd,disc:[],market:[],pool:[],round:1,pl,slots:[],log:'',sel:null,scouted:null};
 ui();
}
function pickEfed(i){const p=me(),e=p.opts[i];p.efed=e;p.cash+=e.cash;p.inc+=e.inc;p.hyp+=e.hyp;p.opts=[];
 if(G.cur===0){G.cur=1;G.ready=false;ui();}else startDraft();}

// ---------- DRAFT ----------
function startDraft(){
 if(G.wd.length<10){G.wd.push(...sh(G.disc.filter(c=>c.atk)));G.disc=G.disc.filter(c=>!c.atk);}
 G.pool=G.wd.splice(0,10);
 G.pl.forEach(p=>{p.done=false;p.picks=0});
 G.ph='draft';G.cur=(G.round-1)%2;G.ready=false;autoDone();
}
function autoDone(){
 G.pl.forEach(p=>{if(!G.pool.some(c=>c.cost<=p.cash))p.done=true});
 if(G.pl.every(p=>p.done)||!G.pool.length){G.disc.push(...G.pool);G.pool=[];return startShow();}
 if(me().done){G.cur=1-G.cur;G.ready=false}
 ui();
}
function draft(i){const p=me(),c=G.pool.splice(i,1)[0];p.cash-=c.cost;p.signed.push(c);p.hand.push(c);p.picks++;nextDraft();}
function stopDraft(){me().done=true;nextDraft();}
function nextDraft(){const o=1-G.cur;if(!G.pl[o].done){G.cur=o;G.ready=false}autoDone();}

// ---------- SHOW ----------
function startShow(){
 G.slots=Array.from({length:G.round===MAXR?8:6},()=>({atk:null,def:null}));
 G.pl.forEach(p=>{p.passed=false;p.last=null});
 G.ph='show';G.cur=(G.round-1)%2;G.ready=false;G.sel=null;G.step=null;G.scouted=null;ui();
}
function endTurn(){
 G.sel=null;if(G.step!=='board')G.step=null;
 if(G.pl[0].passed&&G.pl[1].passed)return resolve();
 const o=1-G.cur; if(!G.pl[o].passed){G.cur=o;G.ready=false}
 ui();
}
function play(si){
 const p=me(),c=p.hand.splice(G.sel.i,1)[0],s=G.slots[si],role=s.atk?'def':'atk';
 s[role]={p:G.cur,c,pw:[]};p.last=s[role];
 if(c.champ&&si===G.slots.length-1)p.tok++;
 endTurn();
}
function attach(si,r){const p=me(),pc=p.pw.splice(G.sel.i,1)[0],e=G.slots[si][r];e.pw.push(pc);p.last=e;endTurn();}
function drawPower(){if(!G.pd.length){G.pd=sh(G.disc.filter(c=>c.cat));G.disc=G.disc.filter(c=>!c.cat);}
 if(G.pd.length)me().pw.push(G.pd.shift());endTurn();}
function scoutDeck(){if(!G.wd.length)return;G.scouted=G.wd.shift();ui();}
function buy(src,i){const p=me(),c=src==='s'?G.scouted:G.market.splice(i,1)[0];p.cash-=c.cost;p.hand.push(c);G.scouted=null;endTurn();}
function toMarket(){G.market.push(G.scouted);if(G.market.length>5)G.disc.push(G.market.shift());G.scouted=null;endTurn();}
function pass(){me().passed=true;endTurn();}

// ---------- RESOLUTION (one match at a time, animated) ----------
const ANIM_SPEED=1; // 0 = instant, 1 = normal, 2 = slower
const who=p=>AI[p]?'Opponent':'Player '+(p+1);
function calc(e,role){
 const p=G.pl[e.p],w=e.c;
 const fx=[...w.fx.map(f=>({f,src:w.n})),...e.pw.flatMap(x=>x.fx.map(f=>({f,src:x.n}))),...(p.efed.fx||[]).map(f=>({f,src:p.efed.n}))];
 let v=role==='atk'?w.atk:w.def,win=w.win;
 const st=[{t:`${w.n} base ${role==='atk'?'attack':'defense'}`,n:v,run:v}],ws=[{t:'base',n:w.win}];
 fx.forEach(({f,src})=>{if(f.tag&&!w.tags.includes(f.tag))return;
  if(f.k===role){v+=f.n;st.push({t:`${src}: ${fxT(f)}`,n:f.n,run:v})}
  if(f.k==='perPower'&&f.s===role){const n=f.n*e.pw.length;if(n){v+=n;st.push({t:`${src}: ${e.pw.length} attached`,n,run:v})}}
  if(f.k==='win'){win+=f.n;ws.push({t:src,n:f.n})}});
 return{v,win,st,ws};
}
function done(e){const o=G.pl[e.p];e.pw.forEach(x=>x.keep?o.pw.push(x):G.disc.push(x));o.hand.push(e.c);}
function resolveOne(i){
 const s=G.slots[i],main=i===G.slots.length-1,r={i,main};
 if(!s.def){
  const e=s.atk,p=G.pl[e.p],tok=p.tok;
  Object.assign(r,{kind:'promo',ec:cl(e.c),pw:e.pw.map(x=>x.n),winner:e.p,promo:e.c.promo,tok});
  p.cash+=r.promo;e.c.hype+=tok;p.tok=0;r.hype=e.c.hype;
  G.sum.push(`Match ${i+1}: PROMO by ${who(e.p)} ${e.c.n}, +$${r.promo}`);done(e);return r;}
 const A=calc(s.atk,'atk'),D=calc(s.def,'def'),aw=A.v>D.v,w=aw?s.atk:s.def,W=aw?A:D,wp=G.pl[w.p];
 Object.assign(r,{kind:'match',ac:cl(s.atk.c),dc:cl(s.def.c),ap:s.atk.p,dp:s.def.p,apw:s.atk.pw.map(x=>x.n),dpw:s.def.pw.map(x=>x.n),A,D,aw,wn:w.c.n,wp:w.p,tie:A.v===D.v,lines:[]});
 wp.cash+=W.win;let got=W.win;
 r.lines.push(`Win payout +$${W.win}`+(W.ws.length>1?` (${W.ws.map(x=>x.n).join(' + ')})`:''));
 const hy=(s.atk.c.hype+s.def.c.hype)*HV;
 if(hy){wp.cash+=hy;got+=hy;r.lines.push(`Hype tokens cashed in +$${hy}`);s.atk.c.hype=0;s.def.c.hype=0;}
 if(s.atk.c.champ||s.def.c.champ||(main&&G.round===1)){s.atk.c.champ=false;s.def.c.champ=false;w.c.champ=true;wp.vp+=3;r.lines.push('Takes the championship token +3 VP');}
 G.sum.push(`Match ${i+1}: ${who(w.p)} ${w.c.n} wins (${A.v} vs ${D.v}), +$${got}${r.lines.length>(hy?2:1)?', +3 VP':''}`);
 done(s.atk);done(s.def);return r;
}
function resolve(){
 G.ph='resolve';G.rq=G.slots.map((x,i)=>(x.atk||x.def)?i:-1).filter(i=>i>=0);G.rn=0;G.res=null;G.sum=[];G.eos=[];G.fin=false;ui();
}
function nextMatch(){if(G.rn>=G.rq.length)return finishShow();G.res=resolveOne(G.rq[G.rn++]);ui();}
function finishShow(){
 G.eos=G.pl.map((p,i)=>{p.cash+=p.inc;p.tok+=p.hyp;let d=0;for(let k=0;k<2&&G.pd.length;k++){p.pw.push(G.pd.shift());d++}return `${who(i)}: +$${p.inc} merch income, +${p.hyp} hype tokens, drew ${d} power cards`});
 G.fin=true;G.res=null;ui();
}
function nextShow(){G.round++;if(G.round>MAXR){G.ph='end';ui();}else startDraft();}

// ---------- UI ----------
const ENABLE_SCOUT=false, ENABLE_DRAW=false; // turn on later
const AI=[false,true]; // which players are AI (set both false for hot-seat)
let aiT;
const score=p=>p.vp+[...new Set([...p.signed,...p.hand])].reduce((s,c)=>s+c.vp+c.fx.filter(f=>f.k==='vp').reduce((a,f)=>a+f.n,0),0);
const chip=t=>`<span class="chip">${t}</span>`;
const IMG_BASE='images/',IMG_EXT='.png'; // card art: images/<card-name-slug>.png, e.g. images/iron-mako.png
const slug=n=>n.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
function cardH(c,o={}){
 const w=c.atk!==undefined,e=c.cash!==undefined,k=w?'var(--w)':e?'var(--e)':'var(--p)';
 const src=c.img||IMG_BASE+slug(c.n)+IMG_EXT;
 const fx=(c.fx||[]).map(fxT).join('<br>')+(c.keep?'<br><i>Returns to hand after use</i>':'');
 return `<div class="cw"><div class="c ${o.sel?'sel':''} ${o.off?'off':''} ${c.champ?'champ':''}" style="--k:${k}"><div class="im"><span>${c.n[0]}</span><img src="${src}" alt="" onerror="this.remove()"></div><div class="top">${w?`<i class="coin" title="Signing cost">${c.cost}</i>`:''}<b>${c.n}</b>${w?`<span class="tg">${c.tags.map(t=>`<em>${t}</em>`).join('')}</span>`:''}</div>${w?`<div class="stat a" title="Attack">⚔ <b>${c.atk}</b></div><div class="stat d" title="Defense"><b>${c.def}</b> 🛡</div>`:''}${c.champ?'<div class="flag cr">★ CHAMPION</div>':''}${c.hype?`<div class="flag hy">🔥 ${c.hype}</div>`:''}<div class="tx">${c.cat?`<small>${c.cat}</small>`:''}${w?`<div class="pay"><span>🏆 Win $${c.win}</span><span>🎤 Promo $${c.promo}</span></div>`:''}${e?`<div class="pay"><span>💵 $${c.cash}</span><span>📈 +${c.inc}</span><span>🔥 +${c.hyp}</span></div>`:''}${fx?`<p>${fx}</p>`:''}</div>${w&&c.vp?`<i class="vps" title="Victory points">${c.vp}</i>`:''}</div>${o.btn?`<div class="bt">${o.btn}</div>`:''}</div>`;
}
const head=()=>`<h1>WRESTLING <span>TCG</span></h1><div class="hud">${G.pl.map((p,i)=>`<div class="pp ${G.ph==='show'&&i===G.cur?'on':''}"><div class="pn">${AI[i]?'OPPONENT (AI)':'PLAYER '+(i+1)}<small>${p.efed?p.efed.n:'choosing eFed…'}</small></div><div class="tiles"><div class="tile"><small>CASH</small><b>$${p.cash}</b><i>+${p.inc}/show</i></div><div class="tile"><small>HYPE</small><b>${p.tok}</b><i>+${p.hyp}/show</i></div><div class="tile"><small>VP</small><b>${p.vp}</b><i>&nbsp;</i></div><div class="tile"><small>HAND</small><b>${p.hand.length}</b><i>wrestlers</i></div></div></div>`).join('')}</div>`;
const efedH=()=>`<div class="bar">SETUP<span>Player ${G.cur+1}: choose your eFed</span></div><div class="row">${me().opts.map((e,i)=>cardH(e,{btn:`<button onclick="pickEfed(${i})">Choose</button>`})).join('')}</div>`;
const VW=()=>{const h=AI.findIndex(x=>!x);return AI[G.cur]&&h>=0?h:G.cur}; // whose cards are shown on screen
function draftH(){const p=G.pl[VW()],b=AI[G.cur];return `<div class="bar">DRAFT · SHOW ${G.round}<span>${b?'Opponent':'Player '+(G.cur+1)}'s pick</span></div><p class="hint">Sign wrestlers into your hand. Unaffordable cards are greyed out. You must sign at least one. Press Stop drafting when you are done.</p><div class="row">${G.pool.map((c,i)=>{const no=c.cost>p.cash;return cardH(c,{off:no,btn:`<button ${no||b?'disabled':''} onclick="draft(${i})">Sign $${c.cost}</button>`})}).join('')}</div><button class="ghost" style="margin-top:12px" ${p.picks&&!b?'':'disabled'} onclick="stopDraft()">Stop drafting</button>`;}
function slotCol(sl,r){
 const e=sl[r],nm=r==='atk'?'Attacker':'Defender';
 if(!e)return `<div><div class="role">${nm}</div><div class="empty">Empty</div></div>`;
 const vis=e.p===VW()||e.c.champ||e.c.hype;
 const pw=vis?e.pw.map(x=>`<span class="att">+ ${x.n}</span>`).join(''):(e.pw.length?`<span class="att">${e.pw.length} power attached</span>`:'');
 return `<div><div class="role">${nm} · P${e.p+1}</div>${vis?cardH(e.c):`<div class="cw"><div class="c back"><b>?</b><small>face-down</small></div></div>`}<div class="atts">${pw}</div></div>`;
}
function miniH(e,r){
 if(!e)return `<div class="mc none">${r==='atk'?'ATK':'DEF'}<br>—</div>`;
 const mine=e.p===VW();
 if(!(mine||e.c.champ||e.c.hype))return `<div class="mc back">?${e.pw.length?`<i>+${e.pw.length}</i>`:''}</div>`;
 return `<div class="mc ${mine?'me':'op'}" title="${e.c.n}"><div class="im"><span>${e.c.n[0]}</span><img src="${e.c.img||IMG_BASE+slug(e.c.n)+IMG_EXT}" alt="" onerror="this.remove()"></div><b>${e.c.n}</b><u>⚔${e.c.atk} 🛡${e.c.def}</u>${e.pw.length?`<i>+${e.pw.length}</i>`:''}</div>`;
}
const preview=()=>`<div class="pv">${G.slots.map((sl,i)=>`<div class="pt ${i===G.slots.length-1?'main':''}"><small>MATCH ${i+1}${i===G.slots.length-1?' ★':''}</small><div>${miniH(sl.atk,'atk')}${miniH(sl.def,'def')}</div></div>`).join('')}</div>`;
function showH(){
 const p=G.pl[VW()],busy=AI[G.cur],st=G.step,s=G.sel,last=G.slots.length-1;
 const turn=`<div class="bar">SHOW ${G.round} / ${MAXR}${G.round===MAXR?' · PLE':''}<span>${busy?'Opponent':'Player '+(G.cur+1)}'s turn</span></div>`;
 const back=`<button class="ghost" onclick="G.sel=null;G.step=null;ui()">← Back</button>`;
 const view=`<button class="ghost" onclick="G.sel=null;G.step='board';ui()">View matches</button>`;
 const board=c=>`<div class="slots">${G.slots.map((sl,i)=>{const can=c&&(!sl.atk||(!sl.def&&sl.atk.p!==G.cur));return `<div class="slot ${i===last?'main':''}"><div class="sh"><b>MATCH ${i+1}</b>${i===last?'<em>★ MAIN EVENT</em>':''}${can?`<button onclick="play(${i})">Play here</button>`:''}</div><div class="cols">${slotCol(sl,'atk')}${slotCol(sl,'def')}</div></div>`}).join('')}</div>`;
 if(st==='board')return turn+`<div class="acts">${back}</div><p class="hint">All matches this show. Scroll sideways.</p>`+board(null);
 if(busy)return turn+`<p class="hint big">Opponent is thinking…</p><div class="acts">${view}</div><h3>The show so far</h3>${preview()}`;
 const w=st==='place'&&s&&s.t==='w'?p.hand[s.i]:null;
 if(w)return turn+`<div class="acts">${back}</div><div class="sel-row"><div style="zoom:.55">${cardH(w)}</div><div style="flex:1;min-width:240px"><h3 style="margin-top:0">Where should ${w.n} go?</h3><p class="hint">An empty match: ${w.n} attacks. A match with an opponent's face-down attacker: ${w.n} defends. Scroll sideways for more matches.</p></div></div>`+board(w);
 const mine=G.slots.flatMap((sl,i)=>['atk','def'].filter(r=>sl[r]&&sl[r].p===G.cur&&sl[r].pw.length<5).map(r=>({e:sl[r],i,r})));
 const pc=st==='attach'&&s&&s.t==='p'?p.pw[s.i]:null;
 if(pc)return turn+`<div class="acts">${back}</div><div class="sel-row"><div style="zoom:.55">${cardH(pc)}</div><div style="flex:1;min-width:240px"><h3 style="margin-top:0">Attach ${pc.n} to which wrestler?</h3><p class="hint">${mine.length?'Choose one of your wrestlers on the board. Max 5 power cards per match.':'You have no wrestler on the board that can take it.'}</p></div></div><div class="row">${mine.map(m=>cardH(m.e.c,{btn:`<button onclick="attach(${m.i},'${m.r}')">Attach · Match ${m.i+1} ${m.r==='atk'?'attacker':'defender'} · ${m.e.pw.length}/5</button>`})).join('')}</div>`;
 const canAct=p.hand.length||(p.pw.length&&mine.length);
 let h=turn+`<p class="hint big">${canAct?'Your turn — pick a wrestler to play'+(p.pw.length?', or a power card to attach':'')+'. Press Pass when you are done: you cannot play again this show.':'You are out of cards to play. Press Pass to finish your show. When both players pass, the matches are resolved.'}</p><div class="acts"><button ${canAct?'class="ghost"':''} onclick="pass()">${canAct?'Pass — I am done':'Pass'}</button>${view}${ENABLE_SCOUT&&!G.scouted?`<button onclick="scoutDeck()">Scout</button>`:''}${ENABLE_DRAW&&!G.scouted?`<button onclick="drawPower()">Draw a power card</button>`:''}</div>`;
 if(G.scouted){const k=G.scouted;h+=`<div class="row">${cardH(k)}</div><div class="acts"><button ${k.cost>p.cash?'disabled':''} onclick="buy('s')">Sign for $${k.cost}</button><button onclick="toMarket()">Decline — send to market</button></div>`;}
 h+=`<h3>The show so far</h3>${preview()}`;
 h+=`<h3>Your wrestlers</h3><div class="row">${p.hand.map((c,i)=>cardH(c,{btn:`<button onclick="G.sel={t:'w',i:${i}};G.step='place';ui()">Play</button>`})).join('')||'<p class="hint">No wrestlers in hand.</p>'}</div>`;
 if(p.pw.length)h+=`<h3>Your power cards</h3><p class="hint">${mine.length?'Pick a power card, then choose which of your wrestlers on the board it goes on.':'Play a wrestler first — power cards attach to your wrestlers on the board.'}</p><div class="row">${p.pw.map((c,i)=>cardH(c,{btn:`<button ${mine.length?'':'disabled'} onclick="G.sel={t:'p',i:${i}};G.step='attach';ui()">Attach</button>`})).join('')}</div>`;
 if(ENABLE_SCOUT&&G.market.length&&!G.scouted)h+=`<h3>Market</h3><div class="row">${G.market.map((c,i)=>cardH(c,{off:c.cost>p.cash,btn:`<button ${c.cost>p.cash?'disabled':''} onclick="buy('m',${i})">Sign $${c.cost}</button>`})).join('')}</div>`;
 return h;
}
let animT=[];
function stopAnim(){animT.forEach(clearTimeout);animT=[];}
function reveal(el){
 el.classList.add('on');if(el.dataset.cls)el.classList.add(el.dataset.cls);
 if(el.dataset.run!==undefined){const t=document.getElementById(el.dataset.tot);if(t){t.textContent=el.dataset.run;t.classList.remove('pop');void t.offsetWidth;t.classList.add('pop')}}
 if(el.dataset.en)el.disabled=false;if(el.dataset.hide)el.style.display='none';
}
function startAnim(){stopAnim();document.querySelectorAll('[data-t]').forEach(el=>{const t=+el.dataset.t*ANIM_SPEED;if(t<=0)reveal(el);else animT.push(setTimeout(()=>reveal(el),t))});}
function skipAnim(){stopAnim();[...document.querySelectorAll('[data-t]')].sort((x,y)=>x.dataset.t-y.dataset.t).forEach(reveal);}
function resH(){
 const r=G.res,n=G.rq.length;
 const head=`<div class="bar">SHOW ${G.round} · MATCH ${r.i+1}${r.main?' ★ MAIN EVENT':''}<span>${G.rn} of ${n}</span></div>`;
 const flip=(c,t)=>`<div class="flip" data-t="${t}"><div class="in"><div class="f">${cardH(c)}</div><div class="b"><div class="c back"><b>?</b><small>face-down</small></div></div></div></div>`;
 const chips=(a,t0)=>a.map((x,j)=>`<span class="att rv" data-t="${t0+j*250}">+ ${x}</span>`).join('');
 const btn=t=>`<div class="acts" style="margin-top:18px;justify-content:center"><button id="skip" class="ghost" data-t="${t}" data-hide="1" onclick="skipAnim()">Skip animation</button><button id="nx" disabled data-t="${t}" data-en="1" onclick="nextMatch()">${G.rn<n?'Next match':'Show summary'}</button></div>`;
 const rw=(arr,t0)=>`<div class="rewards">${arr.map((x,j)=>`<div class="rw rv" data-t="${t0+j*650}">${x}</div>`).join('')}</div>`;
 if(r.kind==='promo'){
  const L=[`Promo payout +$${r.promo}`,r.tok?`${r.tok} hype token${r.tok>1?'s':''} placed on ${r.ec.n} (now ${r.hype})`:'No hype tokens to place'];
  return head+`<div class="arena"><div class="side"><div class="role">PROMO · ${who(r.winner)}</div>${flip(r.ec,500)}<div class="atts">${chips(r.pw,1500)}</div></div></div><div class="verdict rv" data-t="1900">🎤 PROMO — nobody challenged ${r.ec.n}</div>`+rw(L,2500)+btn(2500+L.length*650+300);
 }
 const tA=2600,tD=tA+r.A.st.length*700+500,tV=tD+r.D.st.length*700+700,tR=tV+1000;
 const calcH=(cal,t0,id)=>`<div class="calc">${cal.st.map((x,j)=>`<div class="cl rv" data-t="${t0+j*700}" data-run="${x.run}" data-tot="${id}"><span>${x.t}</span><b>${j?'+':''}${x.n}</b></div>`).join('')}</div>`;
 const side=(role,c,pi,pwn,cal,t0,id)=>`<div class="side" data-t="${tV}" data-cls="${(role==='atk')===r.aw?'win':'lose'}"><div class="role">${role==='atk'?'ATTACKER':'DEFENDER'} · ${who(pi)}</div>${flip(c,600)}<div class="atts">${chips(pwn,1600)}</div>${calcH(cal,t0,id)}<div class="tot" id="${id}">–</div><div class="tl">${role==='atk'?'ATTACK':'DEFENSE'}</div></div>`;
 const vt=r.aw?`ATTACK ${r.A.v} BEATS DEFENSE ${r.D.v}`:(r.tie?`TIE ${r.A.v}–${r.D.v} · DEFENDER HOLDS`:`DEFENSE ${r.D.v} HOLDS OFF ATTACK ${r.A.v}`);
 return head+`<div class="arena">${side('atk',r.ac,r.ap,r.apw,r.A,tA,'tot-a')}<div class="vs">VS</div>${side('def',r.dc,r.dp,r.dpw,r.D,tD,'tot-d')}</div><div class="verdict rv" data-t="${tV}">${vt}<b>🏆 ${who(r.wp)} — ${r.wn} WINS</b></div>`+rw(r.lines,tR)+btn(tR+r.lines.length*650+300);
}
function resolveH(){
 if(G.res)return resH();
 if(G.fin)return `<div class="bar">SHOW ${G.round} COMPLETE</div><div id="log">${G.sum.join('\n')||'No matches were played.'}\n\n${G.eos.join('\n')}</div><button onclick="nextShow()">${G.round===MAXR?'Final scores':'Next: draft'}</button>`;
 return `<div class="bar">SHOW ${G.round} · RESOLUTION</div><p class="hint big">${G.rq.length?G.rq.length+' match'+(G.rq.length>1?'es':'')+' to resolve, one at a time.':'No matches were played this show.'}</p><button onclick="nextMatch()">${G.rq.length?'Start':'Continue'}</button>`;
}
function endH(){const a=score(G.pl[0]),b=score(G.pl[1]);return `<div class="bar">GAME OVER</div><div class="hud"><div class="pp ${a>=b?'on':''}"><div class="pn">PLAYER 1</div><div class="pills"><span>🏆 ${a} VP</span></div></div><div class="pp ${b>=a?'on':''}"><div class="pn">PLAYER 2</div><div class="pills"><span>🏆 ${b} VP</span></div></div></div><h3>${a===b?'Tie game':'Player '+(a>b?1:2)+' wins'}</h3><button onclick="newGame()">New game</button>`;}
// ---------- AI (player 2) ----------
const fxVal=(c,w,role)=>c.fx.reduce((t,f)=>(f.tag&&!w.tags.includes(f.tag))?t:t+(f.k===role||f.k==='win'||(f.k==='perPower'&&f.s===role)?f.n:0),0);
function aiStep(){
 if(!AI[G.cur])return;
 const p=me();
 if(G.ph==='efed'){const o=p.opts.map((e,i)=>[e.cash+e.inc*4+e.hyp*2+e.fx.length*3,i]).sort((a,b)=>b[0]-a[0]);return pickEfed(o[0][1]);}
 if(G.ph==='draft'){
  const ok=G.pool.map((c,i)=>({c,i})).filter(x=>x.c.cost<=p.cash);
  if(!ok.length||p.picks>=3)return stopDraft();
  ok.sort((x,y)=>(y.c.atk+y.c.def+y.c.vp*2+y.c.fx.length*2-y.c.cost*.3)-(x.c.atk+x.c.def+x.c.vp*2+x.c.fx.length*2-x.c.cost*.3));
  return draft(ok[0].i);
 }
 if(G.ph==='show'){
  const sl=G.slots;
  if(p.last&&p.last.pw.length<5&&p.pw.length){
   const e=p.last,role=sl.some(x=>x.atk===e)?'atk':'def';
   const best=p.pw.map((c,i)=>[fxVal(c,e.c,role),i]).sort((a,b)=>b[0]-a[0])[0];
   if(best[0]>0){G.sel={t:'p',i:best[1]};return attach(sl.findIndex(x=>x[role]===e),role);}
  }
  const atkS=[],defS=[];
  sl.forEach((x,i)=>{if(!x.atk)atkS.push(i);else if(!x.def&&x.atk.p!==G.cur)defS.push(i)});
  if(!p.hand.length||(!atkS.length&&!defS.length))return pass();
  const useDef=defS.length&&(!atkS.length||Math.random()<.5),key=useDef?'def':'atk',slots=useDef?defS:atkS;
  const wi=p.hand.map((c,i)=>[c[key]+fxVal({fx:c.fx},c,key),i]).sort((a,b)=>b[0]-a[0])[0][1];
  const si=(!useDef&&slots.includes(sl.length-1)&&Math.random()<.4)?sl.length-1:slots[Math.floor(Math.random()*slots.length)];
  G.sel={t:'w',i:wi};return play(si);
 }
}
function ui(){
 stopAnim();
 if(AI.some(Boolean))G.ready=true;
 const ai=AI[G.cur]&&['efed','draft','show'].includes(G.ph);
 if(ai&&G.ph==='efed')return aiStep();
 const a=document.getElementById('app');
 if(!G.ready&&!['resolve','end'].includes(G.ph)){a.innerHTML=`<div class="pass"><h2>Pass the device to Player ${G.cur+1}</h2><p class="hint">Hidden cards stay hidden until you reveal.</p><button onclick="G.ready=true;ui()">I'm Player ${G.cur+1} — reveal my cards</button></div>`;return;}
 a.innerHTML=(G.ph==='resolve'&&!G.fin?'':head())+({efed:efedH,draft:draftH,show:showH,resolve:resolveH,end:endH})[G.ph]();
 clearTimeout(aiT);if(ai)aiT=setTimeout(aiStep,900);
 if(G.ph==='resolve'&&G.res)startAnim();
}
newGame();
</script></body></html>
