<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<script>/* when the host serves this page at /CCG (no trailing slash), make cards.js and images/ resolve inside that folder */if(location.protocol!=="file:"&&!/\/$/.test(location.pathname)&&!/\.[a-z0-9]+$/i.test(location.pathname))document.write('<base href="'+location.pathname+'/">');</script>
<title>CAW Card Game</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Anton&family=Oswald:wght@500;600;700&family=Big+Shoulders+Display:wght@700;800;900&family=Barlow+Semi+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#070b14;--panel:#151c2b;--bg2:#10162a;--line:#2b3550;--ink:#e9e4da;--mute:#8f98b3;--acc:#ff7a3d;--gold:#f0c23c;--w:#d9632b;--p:#2f8fbf;--e:#e0b23a}
*{box-sizing:border-box}
body{margin:0;padding:14px;font:500 15px/1.45 'Barlow Semi Condensed','Segoe UI',system-ui,sans-serif;color:var(--ink);background:radial-gradient(1.5px 1.5px at 12% 18%,#fff9 50%,#0000),radial-gradient(1px 1px at 38% 62%,#fff7 50%,#0000),radial-gradient(1.5px 1.5px at 71% 24%,#fff9 50%,#0000),radial-gradient(1px 1px at 88% 78%,#fff7 50%,#0000),radial-gradient(ellipse at 50% 120%,#5a1d12 0%,#0000 55%),linear-gradient(#070b14,#0e1424) fixed;min-height:100vh}
#app{max-width:1006px;margin:auto} /* exactly five 190px cards + gaps */
h1,h2,h3,.bar,.pn{font-family:'Big Shoulders Display',Impact,'Arial Narrow',sans-serif;font-weight:700;letter-spacing:1px}
h1{font-size:30px;letter-spacing:7px;text-align:center;margin:4px 0 10px}h1 span{color:var(--acc)}
h3{font-size:17px;margin:20px 0 6px;color:var(--acc);text-transform:uppercase}
.hint{color:var(--mute);margin:0 0 8px}.hint.big{font-size:20px;margin:22px 0}
.hud{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pp{background:linear-gradient(#18203366,#101626);border:2px solid var(--line);border-radius:12px;padding:8px 10px}
.pp.on{border-color:var(--acc);box-shadow:0 0 16px #ff7a3d55}
.pn{font-size:16px;display:flex;justify-content:space-between;align-items:baseline}
.pn small{font:500 13px 'Barlow Semi Condensed',sans-serif;color:var(--mute);letter-spacing:0}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:6px}
.tile{background:#0a0e17;border:1px solid var(--line);border-radius:8px;text-align:center;padding:4px 2px}
.tile small{display:block;font-size:10px;color:var(--mute);letter-spacing:1.5px}
.tile b{font:700 22px 'Barlow Semi Condensed',sans-serif;display:block;line-height:1.1}.tile i{font-style:normal;font-size:11px;color:#8fd98f}
.pills span{background:#0a0e17;border:1px solid var(--line);border-radius:12px;padding:2px 12px;font-size:16px}
button{font:inherit;font-weight:700;background:var(--acc);color:#1a0d05;border:0;padding:7px 16px;border-radius:20px;cursor:pointer;margin:2px 6px 2px 0;text-transform:uppercase;letter-spacing:.5px;font-size:13px}
button:hover:not(:disabled){filter:brightness(1.12)}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
button:disabled{background:#2a3047;color:#6c7490;cursor:not-allowed}
button.ghost{background:transparent;color:var(--ink);border:2px solid var(--line)}
.bar{display:flex;justify-content:space-between;align-items:center;margin:16px 0 8px;font-size:22px;text-transform:uppercase}
.bar span{font:700 13px 'Barlow Semi Condensed',sans-serif;color:#1a0d05;background:var(--acc);padding:3px 14px;border-radius:14px;letter-spacing:.5px}
.row{display:flex;flex-wrap:wrap;gap:14px;justify-content:center}
.cw{width:190px}
.c{position:relative;width:190px;height:285px;border:3px solid var(--k,var(--line));border-radius:12px;overflow:hidden;background:#0a0e17;box-shadow:0 4px 14px #000a;transition:transform .15s,box-shadow .15s}
.c:hover{transform:translateY(-4px);box-shadow:0 10px 22px #000c}
.c.sel{box-shadow:0 0 0 3px var(--acc),0 10px 22px #000c;transform:translateY(-6px)}
.c.off{opacity:.4;filter:grayscale(.6)}.c.champ{box-shadow:0 0 0 2px var(--gold),0 0 18px #f0c23caa}
.im{position:absolute;inset:0;background:radial-gradient(circle at 50% 35%,color-mix(in srgb,var(--k) 55%,#000),#0a0e17 75%);display:grid;place-items:center}
.im span{font:110px 'Big Shoulders Display',Impact,sans-serif;color:#fff2}
.im img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.top{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;gap:6px;padding:5px 7px;min-height:32px;background:linear-gradient(var(--k),color-mix(in srgb,var(--k) 65%,#000));font:700 15px 'Barlow Semi Condensed','Segoe UI',sans-serif;color:#fff;text-shadow:0 1px 2px #0008}
.top b{flex:1;line-height:1.1}
.coin{flex:none;width:26px;height:26px;border-radius:50%;background:radial-gradient(#ffd96b,#c8921a);color:#3a2500;display:grid;place-items:center;font:700 14px 'Barlow Semi Condensed',sans-serif;font-style:normal;border:2px solid #fff6}
.tg{display:flex;gap:3px;flex-wrap:wrap;justify-content:flex-end;max-width:68px}.tg em{font:600 9px 'Barlow Semi Condensed',sans-serif;font-style:normal;background:#0007;border-radius:6px;padding:0 5px;text-transform:uppercase}
.stat{position:absolute;top:50px;display:flex;align-items:center;gap:3px;padding:2px 9px 2px 7px;font-size:13px;color:#fff;background:#b8332e;border:2px solid #fff5;border-left:0;border-radius:0 14px 14px 0;left:0}
.stat b{font:700 22px 'Barlow Semi Condensed',sans-serif}
.stat.d{left:auto;right:0;padding:2px 7px 2px 9px;background:#2d6cc0;border:2px solid #fff5;border-right:0;border-radius:14px 0 0 14px}
.flag{position:absolute;right:6px;padding:1px 9px;border-radius:10px;font-weight:700;font-size:12px}
.flag.cr{top:88px;background:var(--gold);color:#2a1d00}.flag.hy{top:112px;background:#ff9a3d;color:#2a1200}
.tx{position:absolute;left:0;right:0;bottom:0;padding:16px 36px 7px 8px;background:linear-gradient(#0000,#0b0f1acc 22%,#0b0f1af2);font:500 12px/1.3 'Barlow Semi Condensed','Segoe UI',sans-serif}
.tx small{display:block;text-transform:uppercase;letter-spacing:1px;color:var(--p);filter:brightness(1.5);font-size:10px}
.tx p{margin:3px 0 0;background:#ffffff14;border-radius:6px;padding:3px 6px}
.pay{display:flex;gap:8px;flex-wrap:wrap;font-weight:700;color:#e6e9f0;font-size:12px}
.vps{position:absolute;right:6px;bottom:6px;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font:700 16px 'Barlow Semi Condensed',sans-serif;font-style:normal;color:#3a2500;background:radial-gradient(#ffd96b,#d89b22);border:2px solid #fff6}
.bt{margin-top:6px}.bt button{width:100%;margin:0}
.c.back{display:grid;place-items:center;align-content:center;background:repeating-linear-gradient(45deg,#1c2440 0 10px,#151b33 10px 20px);border-color:var(--line)}
.c.back b{font:56px 'Big Shoulders Display',Impact,sans-serif;color:#fff3}.c.back small{color:var(--mute)}
.slots{display:flex;gap:14px;overflow-x:auto;padding:2px 2px 12px;scroll-snap-type:x proximity}
.slot{flex:none;scroll-snap-align:start;background:var(--bg2);border:2px solid var(--line);border-radius:12px;padding:8px 12px 12px}
.slot.main{border-color:var(--gold);box-shadow:0 0 18px #f0c23c33}
.sh{display:flex;align-items:center;gap:10px;margin-bottom:6px;font:700 16px 'Big Shoulders Display',Impact,sans-serif;letter-spacing:1px}
.sh em{color:var(--gold);font-style:normal}.sh button{margin-left:auto}
.cols{display:grid;grid-template-columns:repeat(2,190px);gap:16px;zoom:.8}
.role{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--mute);margin-bottom:4px}
.empty{width:190px;height:285px;border:2px dashed var(--line);border-radius:12px;display:grid;place-items:center;color:var(--mute)}
.atts{margin-top:5px;display:flex;flex-wrap:wrap;gap:4px}.att{background:var(--p);color:#04121c;border-radius:10px;padding:0 9px;font-size:12px;font-weight:700}
.acts{display:flex;flex-wrap:wrap;align-items:center}
#log{white-space:pre-wrap;background:#05070f;border:1px solid var(--line);border-radius:10px;padding:12px;max-height:420px;overflow:auto;font:12px/1.55 ui-monospace,Consolas,monospace;margin:8px 0}
.pass{text-align:center;margin:12vh auto;max-width:420px;background:var(--panel);border:2px solid var(--acc);border-radius:16px;padding:30px}
.pass h2{font-size:28px;color:var(--acc);margin:0 0 12px;text-transform:uppercase}
.pv{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 10px}
.pt{flex:none;background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:4px 6px}
.pt.main{border-color:var(--gold)}.pt small{display:block;color:var(--mute);font-size:10px;letter-spacing:1px;margin-bottom:2px}
.pt>div{display:flex;gap:4px}
.mc{position:relative;width:62px;height:84px;border:2px solid var(--k,var(--line));border-radius:6px;overflow:hidden;background:#0a0e17;font-size:9px;line-height:1.1}
.mc.me{--k:var(--acc)}.mc.op{--k:var(--p)}
.mc .im span{font-size:30px}
.mc b{position:absolute;left:0;right:0;top:0;background:#000a;padding:1px 2px;font-weight:700;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;z-index:1}
.mc u{position:absolute;left:0;right:0;bottom:0;background:#000b;text-decoration:none;text-align:center;padding:1px 0;color:#e6e9f0;font-weight:700;z-index:1}
.mc i{position:absolute;right:2px;top:12px;background:var(--p);color:#04121c;border-radius:6px;padding:0 4px;font-style:normal;font-weight:700;z-index:1}
.mc.none{display:grid;place-items:center;text-align:center;border-style:dashed;color:var(--mute);background:none}
.mc.back{display:grid;place-items:center;background:repeating-linear-gradient(45deg,#1c2440 0 6px,#151b33 6px 12px);border-color:var(--line);font:700 22px 'Big Shoulders Display',sans-serif;color:#fff4}
.sel-row{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap}
.arena{display:flex;flex-wrap:wrap;gap:26px;justify-content:center;align-items:flex-start;margin:10px 0}
.side{width:230px;text-align:center;transition:opacity .5s,filter .5s,transform .5s}
.side.win{transform:scale(1.04);filter:drop-shadow(0 0 16px var(--gold))}
.side.lose{opacity:.45;filter:grayscale(.7)}
.vs{align-self:center;font:700 34px 'Big Shoulders Display',Impact,sans-serif;color:var(--acc)}
.flip{width:190px;height:285px;margin:0 auto;perspective:900px}
.flip .in{position:relative;width:100%;height:100%;transition:transform .9s cubic-bezier(.2,.8,.2,1);transform-style:preserve-3d}
.flip.on .in{transform:rotateY(180deg)}
.flip .f,.flip .b{position:absolute;inset:0;backface-visibility:hidden}
.flip .f{transform:rotateY(180deg)}
.rv{opacity:0;transform:translateY(8px);transition:opacity .4s,transform .4s}.rv.on{opacity:1;transform:none}
.calc{margin-top:10px;text-align:left}
.cl{display:flex;justify-content:space-between;gap:8px;background:#ffffff10;border-radius:6px;padding:3px 8px;margin:3px 0;font-size:13px}.cl b{color:var(--gold)}
.tot{font:700 46px 'Big Shoulders Display',Impact,sans-serif;line-height:1;margin-top:6px}.tot.pop{animation:pop .4s}
@keyframes pop{0%{transform:scale(1.5);color:var(--gold)}100%{transform:scale(1)}}
.tl{font-size:11px;letter-spacing:2px;color:var(--mute)}
.verdict{text-align:center;font:700 20px 'Big Shoulders Display',Impact,sans-serif;margin:14px 0 6px;letter-spacing:1px}
.verdict b{display:block;font-size:30px;color:var(--gold);margin-top:2px}
.rewards{display:flex;flex-direction:column;align-items:center;gap:6px}
.rw{background:linear-gradient(90deg,#f0c23c33,#f0c23c11);border:1px solid #f0c23c66;border-radius:20px;padding:4px 18px;font-weight:700}

/* ---- v2 visual upgrade ---- */
h1{background:linear-gradient(90deg,#fff,#ffd9a8 40%,var(--acc));-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none;font-size:34px}
h1 span{color:transparent}
.tb{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center;margin:0 0 12px}
.tb select{font:600 13px 'Barlow Semi Condensed',sans-serif;background:#0a0e17;color:var(--ink);border:2px solid var(--line);border-radius:20px;padding:5px 10px}
button:not(.ghost):not(:disabled){background:linear-gradient(#ff9055,#e0561b);box-shadow:0 2px 0 #7a2a0a}
button:not(.ghost):not(:disabled):active{transform:translateY(1px);box-shadow:none}
.pp{backdrop-filter:blur(4px)}.pp.on{animation:glow 2s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 0 26px #ff7a3d88}}
.c{box-shadow:0 4px 14px #000a,inset 0 0 0 1px #fff2}
.c::after{content:'';position:absolute;inset:0;background:linear-gradient(115deg,#0000 30%,#fff3 46%,#0000 62%);transform:translateX(-130%);transition:transform .7s;pointer-events:none;z-index:3}
.c:hover::after{transform:translateX(130%)}
.coin{box-shadow:0 0 8px #f0c23c88}.stat{font-size:14px;box-shadow:0 2px 6px #0008}.stat b{font-size:24px}
.tx p{border-left:3px solid var(--k);background:#ffffff18}
.tx{max-height:60%;overflow:hidden}
@media (prefers-reduced-motion:reduce){.pp.on,.c::after{animation:none;transition:none}}
/* ---- card editor ---- */
#ed{color:var(--ink);display:none;position:fixed;inset:0;z-index:50;background:#070b14f5;overflow:auto;padding:14px}
.edh{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}.edh h2{margin:0 12px 0 0;font-size:24px;color:var(--acc)}
.tabs{display:flex;gap:4px}
.edb{display:grid;grid-template-columns:230px 1fr 230px;gap:16px;align-items:start}
.edl{display:flex;flex-direction:column;gap:4px;max-height:80vh;overflow:auto}
.eli{background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:6px 10px;cursor:pointer;display:flex;justify-content:space-between;gap:6px}
.eli.on{border-color:var(--acc);background:#2a1a14}.eli em{font:700 10px 'Barlow Semi Condensed',sans-serif;font-style:normal;background:var(--gold);color:#2a1d00;border-radius:8px;padding:1px 7px;white-space:nowrap}
.edf{display:flex;flex-direction:column;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.edf label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--mute);letter-spacing:.5px}
.edf input[type=text],.edf input[type=number],.edf textarea,.edf select,.edf input:not([type]){font:600 15px 'Barlow Semi Condensed',sans-serif;background:#0a0e17;color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:6px 8px;min-width:0}
.edf .chk{flex-direction:row;align-items:center;gap:8px;color:var(--ink);font-size:14px}
.fxs{display:flex;flex-direction:column;gap:6px;align-items:flex-start}.fxr{display:flex;gap:6px;flex-wrap:wrap}.fxr input[type=number]{width:70px}
.img .acts{gap:8px}.img input[type=text]{flex:1;min-width:200px}
.edp{position:sticky;top:0}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--gold);color:#2a1d00;font-weight:700;padding:8px 20px;border-radius:20px;z-index:99;opacity:0;pointer-events:none;transition:opacity .25s}
#toast.on{opacity:1}
@media(max-width:860px){.edb{grid-template-columns:1fr}.edl{max-height:200px}.edp{position:static}}

/* manager cards: art on top, stats strip underneath (never covering the art) */
.c.ef{display:flex;flex-direction:column}
.c.ef .top{position:relative;flex:none}
.c.ef .im{position:relative;inset:auto;flex:1;min-height:0}
.c.ef .tx{position:relative;flex:none;padding:7px 8px;background:#0b0f1a;border-top:2px solid var(--k)}
.c.ef .pay{justify-content:space-around;font-size:14px}

/* ---- v4: black-leather and brass look ---- */
:root{--bg:#08090b;--panel:#121317;--bg2:#0d0e11;--line:#292c33;--ink:#ebe7de;--mute:#8b909a;--acc:#d23a4e;--gold:#ff5a6e;--w:#a8372d;--p:#6b82a0;--e:#b8923a}
body{background:radial-gradient(ellipse 80% 50% at 50% -8%,#33291500 0,#2d2413aa 0,#0000 70%),repeating-linear-gradient(135deg,#ffffff06 0 1px,#0000 1px 4px),#08090b fixed}
h1{font-weight:900;font-size:46px;letter-spacing:14px;background:linear-gradient(#f1f3f7,#d23a4e 55%,#7a1623);-webkit-background-clip:text;background-clip:text;color:transparent;margin:6px 0 12px}
h1 span{color:transparent}
h3{color:var(--acc);letter-spacing:3px;font-size:18px;border-bottom:1px solid var(--line);padding-bottom:4px}
.bar{font-size:27px;letter-spacing:2px;border-left:4px solid var(--acc);padding-left:12px}
.bar span{background:linear-gradient(#ef6b7b,#a3202f);color:#ffffff;border-radius:3px;letter-spacing:1.5px;text-transform:uppercase}
button{border-radius:4px;letter-spacing:1.5px;font-size:13px}
button:not(.ghost):not(:disabled){background:linear-gradient(#ef6b7b,#a3202f);color:#ffffff;box-shadow:0 2px 0 #5a1019,0 6px 14px #0008}
button.ghost{border:1px solid #4a4f5a;color:var(--ink)}button.ghost:hover:not(:disabled){border-color:var(--acc);color:var(--acc)}
.tb select{border:1px solid #4a4f5a;border-radius:4px;background:#0d0e11}
.pp{border-radius:8px;border:1px solid var(--line);border-top:2px solid #4a4f5a;background:linear-gradient(#17181d,#0e0f12)}
.pp.on{border-color:var(--acc);border-top-color:var(--gold);animation:none;box-shadow:0 0 0 1px #d23a4e44,0 8px 30px #d23a4e22}
.pn{letter-spacing:2px;font-size:18px}
.tile{border-radius:4px;background:#08090b}.tile b{font-size:28px;font-weight:800;letter-spacing:.5px}.tile i{color:#9ec59a}
.slot,.pt{border-radius:8px}.slot.main,.pt.main{border-color:var(--acc)}
.c{border-radius:8px;border:1px solid color-mix(in srgb,var(--k) 75%,#fff 10%);box-shadow:0 0 0 1px #000,0 10px 24px #000c,inset 0 0 0 1px #ffffff1a}
.c:hover{box-shadow:0 0 0 1px #000,0 16px 30px #000d,inset 0 0 0 1px #ffffff2a}
.c.sel{box-shadow:0 0 0 2px var(--acc),0 14px 30px #000d}
.im{background:radial-gradient(circle at 50% 30%,color-mix(in srgb,var(--k) 40%,#000),#050506 78%)}.im span{color:#ffffff14}
.top{background:linear-gradient(#000000d0,#000000f0);border-bottom:2px solid var(--k);font-size:17px;text-transform:uppercase;letter-spacing:.6px;font-weight:700;text-shadow:none}
.top b{font-family:'Big Shoulders Display',Impact,sans-serif;font-weight:800;font-size:19px;letter-spacing:.8px}
.tg em{background:color-mix(in srgb,var(--k) 55%,#000);border:1px solid #ffffff30;border-radius:3px;letter-spacing:.8px}
.coin{background:linear-gradient(145deg,#ef6b7b,#8f1c2a);border:1px solid #2a0a10;color:#2a1d04;box-shadow:0 1px 4px #000a}
.stat{background:linear-gradient(#22242a,#0a0b0e);border:1px solid #ffffff26;border-left:0;border-bottom:3px solid #c0392b;border-radius:0 4px 4px 0;font-weight:700}
.stat.d{border:1px solid #ffffff26;border-right:0;border-bottom:3px solid #4a86d6;border-radius:4px 0 0 4px}
.stat b{font-family:'Big Shoulders Display',Impact,sans-serif;font-size:27px;font-weight:800}
.tx{background:linear-gradient(#0000,#050608d8 30%,#050608f8)}
.tx p{border:0;border-radius:0;background:none;padding:0;font-size:12.5px}
.pay{color:#e6e9f0;letter-spacing:.3px}
.vps{background:linear-gradient(145deg,#ef6b7b,#8f1c2a);border:1px solid #2a0a10;border-radius:5px;color:#2a1d04}
.c.ef .tx{background:#08090b;border-top:1px solid var(--k)}
.c.back{background:repeating-linear-gradient(45deg,#17191e 0 5px,#0e0f13 5px 10px);border-color:#3a3e48}.c.back b{color:#d23a4e44}
.verdict{letter-spacing:3px}.verdict b{color:var(--gold);font-size:38px;font-weight:900;letter-spacing:4px}
.rw{background:linear-gradient(90deg,#d23a4e30,#d23a4e0a);border:1px solid #d23a4e66;border-radius:3px}
.vs{color:var(--acc);font-weight:900;font-size:40px}
.side.win{filter:drop-shadow(0 0 18px #d23a4ecc)}
.pass{border:1px solid var(--acc);border-radius:8px;background:linear-gradient(#17181d,#0c0d10)}
.att{background:#2b3038;color:var(--ink);border:1px solid #4a4f5a;border-radius:3px}
::-webkit-scrollbar{height:8px;width:8px}::-webkit-scrollbar-thumb{background:#3a3e48;border-radius:4px}::-webkit-scrollbar-track{background:#0d0e11}
.rule{border:1px solid var(--line);border-radius:8px;padding:10px;background:#0d0e11;display:flex;flex-direction:column;gap:8px;width:100%}
.rh,.rb{display:flex;flex-wrap:wrap;gap:6px;align-items:center}.rb{flex-direction:column;align-items:flex-start}.rule b{color:var(--acc);letter-spacing:2px;min-width:44px}

/* ---- v5: arena-black + chrome + gold, centered and proportional ---- */
:root{--cw:clamp(150px,calc((100vw - 56px)/5.4),190px);--r:calc(var(--cw)*.062);--gap:calc(var(--cw)*.075)}
body{padding:20px 14px 56px;background:radial-gradient(ellipse 55% 38% at 10% -6%,#c9d2e630,#0000 70%),radial-gradient(ellipse 55% 38% at 90% -6%,#8fa8d030,#0000 70%),radial-gradient(ellipse 80% 30% at 50% 110%,#8a232a40,#0000 70%),repeating-linear-gradient(135deg,#ffffff05 0 1px,#0000 1px 4px),#08090b;background-attachment:fixed}
#app{max-width:1040px;text-align:center}
#app>button{display:block;margin:20px auto 0}
/* centered headings with gold rules either side */
#app .bar{justify-content:center;gap:16px;border:0;padding:0;margin:28px 0 16px;text-align:center}
#app .bar::before,#app .bar::after{content:"";flex:1;min-width:16px;height:1px;background:linear-gradient(90deg,#0000,#d23a4e99)}
#app .bar::after{background:linear-gradient(270deg,#0000,#d23a4e99)}
#app h3{display:flex;align-items:center;justify-content:center;gap:14px;border:0;padding:0;margin:32px 0 14px;text-align:center}
#app h3::before,#app h3::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,#0000,#d23a4e66)}
#app h3::after{background:linear-gradient(270deg,#0000,#d23a4e66)}
#app .hint{text-align:center;max-width:64ch;margin:0 auto 14px}#app .hint.big{margin:22px auto}
.acts{justify-content:center;gap:6px}
.sel-row{justify-content:center;align-items:center;text-align:center}
.hud{max-width:640px;margin:0 auto;text-align:center}.pn{justify-content:center;gap:12px}
#log{max-width:760px;margin:12px auto;text-align:left}
.gh{margin-bottom:28px}
/* every card is the same 2:3 shape, sized from one variable */
.row{gap:calc(var(--gap)*1.4) var(--gap)}
.cw,.empty,.flip,.c{width:var(--cw)}
.c,.empty,.flip{height:auto;aspect-ratio:2/3}
.c{border-radius:var(--r)}.empty{border-radius:var(--r)}
.bt{margin-top:8px}
body.artonly .c:has(.im img){border:0;background:#000;box-shadow:0 14px 26px #000d,0 2px 6px #000}
body.artonly .c:has(.im img):hover{box-shadow:0 20px 34px #000e,0 0 24px #ff5a6e40}
.c.sel,body.artonly .c.sel:has(.im img){box-shadow:0 0 0 2px var(--gold),0 0 24px #ff5a6e77,0 16px 32px #000d}
.c.champ,body.artonly .c.champ:has(.im img){box-shadow:0 0 0 2px var(--gold),0 0 22px #ff5a6eaa,0 14px 26px #000d}
.c.off{opacity:.38}
.c::after{background:linear-gradient(115deg,#0000 30%,#ffffff40 47%,#0000 62%)}
/* face-down card in the same black, chrome and gold language */
.c.back{border:1px solid #7a2630;background:radial-gradient(circle at 50% 40%,#2b2213,#09090b 72%)}
.c.back::before{content:"";position:absolute;inset:calc(var(--cw)*.04);border:1px solid #d23a4e55;border-radius:calc(var(--r) - 3px)}
.c.back b{font-size:calc(var(--cw)*.34);background:linear-gradient(#f1f3f7,#8f1c2a);-webkit-background-clip:text;background-clip:text;color:transparent}
.c.back small{color:#8b7a4a;letter-spacing:2px;text-transform:uppercase;font-size:10px}
/* board slots and previews */
.slots{padding:2px 2px 14px}.slots>:first-child,.pv>:first-child{margin-left:auto}.slots>:last-child,.pv>:last-child{margin-right:auto}
.slot{background:linear-gradient(#14151a,#0b0c0f);border-radius:10px;text-align:center}
.slot.main{box-shadow:0 0 22px #d23a4e30,inset 0 0 0 1px #d23a4e33}
.sh{justify-content:center;flex-wrap:wrap}.sh button{margin-left:0}
.cols{zoom:1;--cw:150px;grid-template-columns:repeat(2,var(--cw));gap:14px}
.pt{border-radius:8px;text-align:center}.pt>div{justify-content:center}
.mc{width:60px;height:auto;aspect-ratio:2/3;border-radius:5px}
.atts{justify-content:center}
/* results screen */
.arena{gap:calc(var(--gap)*1.6);align-items:flex-start}
.side{width:calc(var(--cw)*1.2)}
.vs{font-size:44px;letter-spacing:4px;background:linear-gradient(#f1f3f7,#8f1c2a);-webkit-background-clip:text;background-clip:text;color:transparent}
.calc{max-width:calc(var(--cw)*1.2);margin-inline:auto}
.zc{border-radius:14px}.zc img{border-radius:6.2%}
@media (max-width:760px){.arena{gap:18px}.vs{width:100%}}

/* ---- v6: pay-per-view arena: black, white, hot red, ring-light blue ---- */
:root{--acc:#ff2442;--gold:#fff;--line:#2a2d36;--blue:#2f6bff}
body{background:radial-gradient(ellipse 60% 40% at 8% -8%,#2f6bff55,#0000 70%),radial-gradient(ellipse 60% 40% at 92% -8%,#ff244255,#0000 70%),radial-gradient(ellipse 90% 25% at 50% 112%,#ff244233,#0000 70%),repeating-linear-gradient(135deg,#ffffff05 0 1px,#0000 1px 4px),#050507;background-attachment:fixed}
h1{font-style:italic;font-weight:900;letter-spacing:12px;background:linear-gradient(#fff,#cfd5e3);-webkit-background-clip:text;background-clip:text;color:transparent;transform:skewX(-8deg)}

button:not(.ghost):not(:disabled){background:linear-gradient(#ff3b57,#c8081f);color:#fff;border-radius:3px;box-shadow:0 2px 0 #6e0613,0 6px 14px #000a}

.gh::before{background:linear-gradient(90deg,var(--blue),#fff,var(--acc))}
.gp-em{--ec:var(--blue)}.gp.r .gp-em{--ec:var(--acc)}.gp.on .gp-em{--ec:#fff}
.gp-t{background:var(--acc);color:#fff}.gp.on::after{background:linear-gradient(90deg,var(--blue),#0000)}.gp.r.on::after{background:linear-gradient(270deg,var(--acc),#0000)}
.hi{color:#9aa3b5;border-color:#2c313c;background:linear-gradient(#1b1e26,#0d0f13)}.hs.hype .hi{color:#ff7a3d;border-color:#4a2a1c}.hs.vp .hi{color:#fff;border-color:var(--acc);background:linear-gradient(#2a1218,#0d0709)}.hs.vp b{color:#fff}
.rp i.done{background:#8a1426}.rp i.now{background:var(--acc);box-shadow:0 0 8px var(--acc)}.gc .ph{color:#ff6b7d}
.pp.on,.pass{border-color:var(--acc);box-shadow:0 0 0 1px #ff244244,0 8px 30px #ff244222}
.slot.main{border-color:var(--acc);box-shadow:0 0 22px #ff244233}
.c.sel,body.artonly .c.sel:has(.im img){box-shadow:0 0 0 2px #fff,0 0 26px #ff2442aa,0 16px 32px #000d}
.c.champ,body.artonly .c.champ:has(.im img){box-shadow:0 0 0 2px #fff,0 0 24px #2f6bffbb,0 14px 26px #000d}
body.artonly .c:has(.im img):hover{box-shadow:0 20px 34px #000e,0 0 24px #ff244255}
.c.back{border-color:#4b505c}.c.back::before{border-color:#ff244266}.c.back b{background:linear-gradient(#fff,#ff2442);-webkit-background-clip:text;background-clip:text}
.vs{background:linear-gradient(#fff,#ff2442);-webkit-background-clip:text;background-clip:text;font-style:italic}
.verdict b{color:#fff}.rw{background:linear-gradient(90deg,#ff244233,#ff24420a);border-color:#ff244288}
.side.win{filter:drop-shadow(0 0 18px #ff2442cc)}

/* ---- tokens ---- */
.flag{display:none!important}
.tks{position:absolute;left:calc(var(--cw)*.04);top:30%;display:flex;flex-direction:column;gap:calc(var(--cw)*.03);z-index:4;pointer-events:none}
.tk{position:relative;width:calc(var(--cw)*.17);height:calc(var(--cw)*.17);border-radius:50%;display:grid;place-items:center;background:#000c;border:1px solid #fff6;font-size:calc(var(--cw)*.09);color:#fff;box-shadow:0 2px 6px #000a}

.tkp.wide{width:180px;height:50px;border-radius:8px}
.fxa{color:#ff5a5a;font-weight:700}.fxd{color:#5aa8ff;font-weight:700}.fxn{color:#fff;font-weight:700}
.rw .fxn{color:#000}/* the silver reward bars: numbers are black so +3 / +1 can be read */
.vpt{display:inline-block;height:1.15em;width:auto;vertical-align:-.2em;margin:0 .05em}.pwt{display:inline-block;height:1.2em;width:auto;vertical-align:-.25em}

.you{font-style:normal;background:var(--gold);color:#241a00;border-radius:3px;padding:1px 6px;margin-left:6px;font-weight:800;font-size:10px;letter-spacing:1px}

@media(max-width:640px){.rost{grid-template-columns:1fr}}
.fwrap{position:relative;width:fit-content;margin:0 auto}
.ctok,.cfrom{position:absolute;left:12.5%;top:35.7%;width:17%;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;z-index:6;pointer-events:none;transform:translate(-50%,-50%);background:radial-gradient(circle at 35% 30%,#fff3b0,var(--gold) 55%,#8a5a00);border:2px solid #fff;color:#4a2f00;font-weight:900;font-size:calc(var(--cw)*.1);line-height:1;box-shadow:0 4px 14px #000b,0 0 18px var(--gold)}
.ctok:has(img),.cfrom:has(img){background:none;border:0;box-shadow:none;filter:drop-shadow(0 4px 8px #000c)}
.ctok img,.cfrom img{width:100%;height:100%;object-fit:contain;border-radius:50%}
.ctok{opacity:0}
.cring{position:absolute;left:50%;top:40%;width:40%;aspect-ratio:1;border-radius:50%;border:3px solid var(--gold);transform:translate(-50%,-50%) scale(.4);opacity:0;pointer-events:none;z-index:5}
.fwrap.hit .ctok{animation:ctok 2.4s linear var(--d,0s) both}
.fwrap.hit .cring{animation:cring .7s ease-out calc(.86s + var(--d,0s)) both}
.fwrap.tkto.hit .flip{animation:chit .45s ease-out calc(.86s + var(--d,0s))}
.fwrap.tkto.hit .f .c{animation:cglow .01s linear calc(.86s + var(--d,0s)) forwards}
.fwrap.tkfrom.hit .cfrom{animation:cfrom .6s cubic-bezier(.5,0,1,.6) both}
.fwrap.tkfrom.hit .tks .tk.champ{visibility:hidden}.fwrap.tkfrom.hit .c.champ{box-shadow:0 14px 26px #000d!important}
@keyframes ctok{
 0%{left:50%;top:-25%;width:62%;font-size:calc(var(--cw)*.36);opacity:0;transform:translate(-50%,-50%) rotate(-50deg);animation-timing-function:cubic-bezier(.55,0,1,.7)}
 10%{opacity:1}
 36%{left:50%;top:40%;width:40%;font-size:calc(var(--cw)*.24);opacity:1;transform:translate(-50%,-50%) rotate(0);animation-timing-function:cubic-bezier(0,.5,.5,1)}
 44%{left:50%;top:35%;width:44%;font-size:calc(var(--cw)*.26);opacity:1;animation-timing-function:ease-in}
 52%{left:50%;top:40%;width:40%;font-size:calc(var(--cw)*.24);opacity:1}
 74%{left:50%;top:40%;width:40%;font-size:calc(var(--cw)*.24);opacity:1;animation-timing-function:cubic-bezier(.6,0,.3,1)}
 100%{left:12.5%;top:35.7%;width:17%;font-size:calc(var(--cw)*.1);opacity:1;transform:translate(-50%,-50%) rotate(0)}}
@keyframes cring{0%{opacity:.95;transform:translate(-50%,-50%) scale(.4)}100%{opacity:0;transform:translate(-50%,-50%) scale(2.6)}}
@keyframes chit{0%{transform:none}20%{transform:translateY(6px) scale(.985)}55%{transform:translateY(-2px)}100%{transform:none}}
@keyframes cglow{to{box-shadow:0 0 0 2px var(--gold),0 0 22px #f0c23caa,0 14px 26px #000d}}
@keyframes cfrom{0%{opacity:1}100%{left:12.5%;top:-30%;width:30%;opacity:0;transform:translate(-50%,-50%) rotate(40deg)}}
body.noanim .fwrap.hit .ctok,body.noanim .fwrap.hit .cfrom,body.noanim .fwrap.hit .cring,body.noanim .fwrap.hit .flip,body.noanim .fwrap.hit .f .c{animation-duration:.01s!important;animation-delay:0s!important}

.hs .hi img{width:100%;height:100%;object-fit:contain;display:block}

/* rating readers: thin 10-step bars, subtle numbers */
.trk{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:8px;padding-bottom:10px}
.tr{--tc:#ff7a3d}.tr.fan{--tc:#2f8fbf}.tr.spo{--tc:#f0c23c}
.tr .tl{display:flex;justify-content:space-between;align-items:baseline;font-size:10px;letter-spacing:1.2px;text-transform:uppercase;color:var(--mute);margin-bottom:3px}
.tr .tl b{color:var(--tc);font-size:12px}
.tb2{display:grid;grid-template-columns:repeat(10,1fr);gap:2px}
.tb2 i{position:relative;height:5px;background:#252c3d;border-radius:1px}
.tb2 i.on{background:var(--tc);box-shadow:0 0 5px var(--tc)}
.tb2 u{position:absolute;top:7px;left:0;right:0;text-align:center;font-size:7px;text-decoration:none;color:#5d667f;font-style:normal}
.rqb,.lkb{display:inline-block;margin:0 3px 3px 0;padding:1px 6px;border-radius:3px;font:700 10px 'Barlow Semi Condensed',sans-serif;letter-spacing:.5px;text-transform:uppercase;background:#0009;border:1px solid var(--tc,#888);color:#fff}
.rqb.rat,.lkb.rat{--tc:#ff7a3d}.rqb.fan,.lkb.fan{--tc:#2f8fbf}.rqb.spo,.lkb.spo{--tc:#f0c23c}
.tri{width:12px;height:12px;object-fit:contain;vertical-align:-2px;margin-right:4px}.tr .tl span{display:inline-flex;align-items:center}
/* HUD: show strip on top, then ONE player's panel with a chevron on the right that switches to the other player */
.gh{display:block}
.gc{flex-direction:row;justify-content:flex-start;align-items:center;gap:12px;min-width:0;padding:6px 14px;border:0;border-bottom:1px solid #2f323b;background:none}
.gc b{font-size:22px}.gc .rp{margin:0}.gc .ph{margin-left:auto}
.gv{position:relative}.gv .gp{padding-right:40px}
.gp.r .gp-hd{flex-direction:row}.gp.r .gp-t{margin-left:auto;margin-right:0}.gp.r .gp-st{flex-direction:row}
.gp.r.on::after{background:linear-gradient(90deg,var(--acc),#0000)}
.gsw,button.gsw:not(.ghost):not(:disabled){all:unset;box-sizing:border-box;position:absolute;right:0;top:0;bottom:0;width:32px;display:grid;place-items:center;cursor:pointer;color:#6f7788;opacity:.75;background:none;box-shadow:none;border-radius:0}
button.gsw:hover:not(:disabled){color:#e9e4da;opacity:1;background:#ffffff08;filter:none}.gsw:focus-visible{outline:1px solid #6f7788;outline-offset:-3px}
.gsw svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:transform .25s}
.gsw.flip svg{transform:rotate(180deg)}
.gsw.dot::after{content:"";position:absolute;top:8px;right:8px;width:8px;height:8px;border-radius:50%;background:var(--gold);box-shadow:0 0 8px var(--gold)}
@media (max-width:760px){.gc{padding:5px 12px}.gc b{font-size:18px}.gv .gp{padding-right:34px}.gsw,button.gsw:not(.ghost):not(:disabled){width:28px}}
/* stats on the left, the three rating tracks stacked as rows on the right */
.gp-bd{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px 24px;align-items:center;margin-top:9px}
.gp-bd .gp-st{margin-top:0;justify-content:flex-start;gap:8px 18px}
.gp .trk{display:flex;flex-direction:column;gap:6px;margin:0;padding:0}
.gp .tr{display:grid;grid-template-columns:76px 1fr 18px;align-items:center;gap:8px}
.gp .tr .tl{display:contents}
.gp .tr .tl span{order:1}.gp .tr .tl span em{font-style:normal}.gp .tr .ts{display:none}
.gp .tr .tb2{order:2}.gp .tr .tl b{order:3;text-align:right}
.gp .tb2 i{height:6px}.gp .tb2 u{display:none}
@media (max-width:760px){.gp-bd{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px 12px}.gp .tr{grid-template-columns:auto 1fr 14px;gap:6px}.gp .tr .tn{display:none}.gp .tr .ts{display:inline}.gp-bd .gp-st{gap:6px 10px}}
/* HUD stat icons: 4px bigger, no border */
.hs .hi,.hs.hype .hi,.hs.vp .hi,.hs.hand .hi,.hs.merch .hi{width:34px;height:34px;border:0}
.hs .hi svg{width:20px;height:20px}
/* stats hierarchy: VP is the hero, cash / hype / merch are the economy, hand is a quiet pill in the header */
.gp-r2{margin-left:auto;display:flex;align-items:center;gap:12px;flex:none}
.gp .gp-r2 .gp-t{margin:0}
.gp-hand{display:inline-flex;align-items:center;gap:5px;color:#7d8391;font:600 9px 'Barlow Semi Condensed',sans-serif;letter-spacing:2px;text-transform:uppercase}
.gp-hand svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.gp-hand b{font:800 16px 'Big Shoulders Display',Impact,sans-serif;letter-spacing:.5px;color:#aab2c2}
.gp-bd .gp-st{display:flex;flex-wrap:nowrap;align-items:center;justify-content:flex-start;gap:20px}
.gp-sub{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;min-width:0;padding-left:20px;border-left:1px solid #2f323b}
.gp .hero .hs{gap:11px}
.gp .hero .hs .hi,.gp .hero .hs.vp .hi{width:54px;height:54px}
.gp .hero .hi svg{width:30px;height:30px}
.gp .hero .ht small{font-size:10px;letter-spacing:2.5px;color:#aab2c2}
.gp .hero .ht small .s{display:none}
.gp .hero .ht b{font-size:46px;line-height:1;color:var(--gold)}
@media (max-width:760px){
 .gp-hand small{display:none}
 .gp-bd .gp-st{flex-direction:column;align-items:flex-start;gap:8px}
 .gp-sub{padding-left:0;border-left:0;gap:6px 10px}
 .gp .hero .hs .hi,.gp .hero .hs.vp .hi{width:42px;height:42px}.gp .hero .hi svg{width:24px;height:24px}
 .gp .hero .ht b{font-size:36px}
 .gp .hero .ht small .l{display:none}.gp .hero .ht small .s{display:inline}
 .gp-sub .ht small,.gp-sub .ht i{display:none}
 .gp-sub .hs{gap:5px}.gp-sub .hs .hi{width:26px;height:26px}.gp-sub .hi svg{width:15px;height:15px}.gp-sub .ht b{font-size:20px}
 .gp .trk{align-self:stretch;justify-content:space-between}
}

/* ---- v7: card-matched look — chrome bevels, black hex mesh, heel red / face blue, heavy condensed type (style only: no layout, flow or animation changes) ---- */

 --chrome:linear-gradient(180deg,#fff 0%,#a9afb9 38%,#f1f3f6 52%,#7a818c 78%,#c9cdd4 100%);
 --chromeR:linear-gradient(180deg,#ff8a99 0%,#c40d26 40%,#ff5a6f 55%,#7a0415 100%);
 --chromeB:linear-gradient(180deg,#9cbcff 0%,#1d55d6 40%,#6f9bff 55%,#0a2470 100%);

 conic-gradient(from 168deg at 94% -6%,#0000 0deg,#ff3a5210 5deg,#0000 10deg,#0000 18deg,#ff3a520d 22deg,#0000 27deg,#0000 360deg),
 radial-gradient(ellipse 70% 22% at 50% 108%,#e3142f30,#0000 70%),
 var(--hex),#040406;background-attachment:fixed}

 background:linear-gradient(180deg,#fffbe6 0%,#ffe08a 38%,#f0a81c 52%,#fff3b0 70%,#c98a10 100%);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-stroke:1px #3a1a00;filter:drop-shadow(0 4px 0 #000) drop-shadow(0 0 24px #f0c23caa);animation:fspSlam var(--t) cubic-bezier(.2,1.3,.3,1) both}

.elx{position:relative;box-sizing:border-box;height:var(--elxh);width:90%;margin:0 auto -2px;padding:calc(var(--cw)*.016) calc(var(--cw)*.03) calc(var(--cw)*.02);display:flex;flex-direction:column;justify-content:space-between;gap:calc(var(--cw)*.01);
 border-radius:calc(var(--cw)*.055) calc(var(--cw)*.055) 0 0;overflow:hidden;-webkit-backdrop-filter:blur(12px) saturate(1.8);backdrop-filter:blur(12px) saturate(1.8)}
.elx::after{content:"";position:absolute;left:5%;right:5%;top:2px;height:40%;border-radius:999px;background:linear-gradient(#ffffffa0,#ffffff00);pointer-events:none}
.elx.ph{display:none;visibility:hidden}.row.sw:has(.elx:not(.ph)) .elx.ph,.cols:has(.elx:not(.ph)) .elx.ph{display:block}
.elx1{position:relative;display:flex;justify-content:center;align-items:center;gap:calc(var(--cw)*.04);font:800 calc(var(--cw)*.05) var(--lab);letter-spacing:calc(var(--cw)*.008);white-space:nowrap;line-height:1}
.elx1 .elv{display:flex;align-items:center;gap:calc(var(--cw)*.015);font-size:calc(var(--cw)*.038 - 2px)}
.elx .vpi{position:relative;display:block;width:calc(var(--cw)*.075);height:calc(var(--cw)*.062)}.elx .vpi img{width:100%;height:100%;object-fit:contain}
.elx .vpi b{position:absolute;right:calc(var(--cw)*-.02);bottom:calc(var(--cw)*-.012);display:grid;place-items:center;min-width:calc(var(--cw)*.042);height:calc(var(--cw)*.042);padding:0 calc(var(--cw)*.006);border-radius:999px;font:800 calc(var(--cw)*.03) var(--lab);color:#ffe9a3;background:#2a1d04;box-shadow:0 0 0 1px #f0c23c}

  push=async k=>{
   if(k==='⌫'){e=e.slice(0,-1);err.textContent='';return paint()}
   if(e.length>=4)return;e+=k;paint();if(e.length<4)return;
   if(Date.now()<PCLOCK){err.textContent='Too many tries. Wait a minute.';e='';return paint()}
   try{const h=Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(e)))).map(x=>x.toString(16).padStart(2,'0')).join('');
    const r=await fetch(HUB_URL+'/rest/v1/admin_config?key=eq.passcode_hash&select=value',{headers:{apikey:HUB_KEY,Authorization:'Bearer '+HUB_KEY}});
    const j=r.ok?await r.json():[],ok=j[0]&&j[0].value;
    if(!ok){err.textContent='Passcode not configured.';e='';return paint()}
    if(h===ok){HUB.pcOk=true;PCBAD=0;return close(true)}
    if(++PCBAD>=5){PCLOCK=Date.now()+60000;PCBAD=0}
    err.textContent='Incorrect passcode';o.querySelector('.pcd').classList.add('bad');setTimeout(()=>{o.querySelector('.pcd').classList.remove('bad')},400)}
   catch(x){err.textContent='Could not verify. Try again.'}
   e='';paint()},
  kd=ev=>{if(ev.key>='0'&&ev.key<='9'){ev.preventDefault();push(ev.key)}else if(ev.key==='Backspace'){ev.preventDefault();push('⌫')}else if(ev.key==='Escape'){ev.preventDefault();close(false)}};
 o.addEventListener('click',ev=>{const b=ev.target.closest('button');if(!b)return;if(b.classList.contains('pcx'))close(false);else if(b.dataset.k!==undefined)push(b.dataset.k)});
 document.addEventListener('keydown',kd,true)})}
document.getElementById('app').innerHTML='<p class="hint" style="text-align:center;margin-top:30vh">Loading cards…</p>';
loadCloud().then(hubInit).then(startGate);
</script></body></html>
